# Codemagic CI — bygger iOS-skalet (Capacitor) och laddar upp till TestFlight.
# Förutsätter: App Store Connect-integration i Codemagic (Team settings → Integrations)
# och bundle-id se.foilio.app registrerat i Developer-portalen (det är det — appen finns
# i App Store Connect). ios/ är INTE incheckat → genereras med `cap add ios` i bygget.
workflows:
  ios-testflight:
    name: Foilio iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: foilio-asc        # namnet du ger integrationen i Codemagic-UI
    environment:
      node: 22
      xcode: latest
      groups:
        - ios_signing        # innehåller CERTIFICATE_PRIVATE_KEY (Codemagic-UI, Secure)
      vars:
        # Appen öppnar direkt på Utforska (ingen blink av marknadsförings-startsidan).
        CAP_SERVER_URL: "https://foilio.se/produkter"
        # Google-inloggning i appen: iOS-klient-id:t (publikt, står i binären ändå).
        GOOGLE_IOS_CLIENT_ID: "920300522039-odqr8p38snk5ouptk3mp4g1e6ntmtojj.apps.googleusercontent.com"
        BUNDLE_ID: "se.foilio.app"
        # App Store-version. 1.0 är godkänd ⇒ 1.1 = Google-/Apple-inloggning. Höj vid varje släpp.
        # ⛔ Höj även `MIN_APP_VERSION` i src/lib/app-version.ts — men först när versionen
        # är GODKÄND i App Store: den tänder "uppdatera appen"-remsan i alla äldre byggen.
        MARKETING_VERSION: "1.1"
        # Capacitor 8 = SPM-mall: inget CocoaPods, ingen .xcworkspace — bygg xcodeproj:t direkt.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Installera deps
        script: |
          # npm ci mot registret är nätverksberoende och dör då och då mitt i
          # nedladdningen (ECONNRESET → hela bygget rött, bygge #34). Höj retries
          # och gör om steget upp till tre gånger innan vi kallar det ett riktigt fel.
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000
          for i in 1 2 3; do
            npm ci --legacy-peer-deps && exit 0
            echo "npm ci föll (försök $i av 3), sannolikt nätverk. Gör om om 15 s."
            sleep 15
          done
          echo "npm ci föll tre gånger i rad. Det är inte flakighet längre, läs loggen ovan."
          exit 1
      - name: Generera iOS-projektet
        script: |
          exec > >(tee "$CM_BUILD_DIR/gen-ios.log") 2>&1
          set -ex
          # Capacitor 8 genererar ett SPM-baserat projekt (ingen pod install som kan
          # falla) → strikt körning, fail loud. Deployment target är iOS 15 nativt.
          ./node_modules/.bin/cap add ios
          # App-ikon: Capacitor genererar EN universell 1024-ikon (AppIcon-512@2x.png).
          # Skriv över den med vår → ingen icon-generator-dep, ingen per-storlek-resize.
          # test = fail loud om Capacitor byter filnamn (samma mönster som grep nedan).
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          test -f "$ICON"
          cp resources/icon-1024.png "$ICON"
          # Splash (#21): Capacitor genererar en VIT default-splash med sin egen logo.
          # Branda om till mörk Foilio-splash (assets/splash.png) → matchar appen +
          # web-laddaren. Bara --ios + splash-källor → app-ikonen ovan rörs inte.
          # fail-loud om imageset:en inte skapades (mall ändrad).
          ./node_modules/.bin/capacitor-assets generate --ios --splashBackgroundColor '#0a0a0c' --splashBackgroundColorDark '#0a0a0c'
          test -f ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png
          # Fixa headern som glider NER efter scroll: WKWebView lägger automatiskt
          # på top-contentInset för safe-area (default .automatic) OVANPÅ vår CSS
          # padding-top: env(safe-area-inset-top) → dubbel topp efter första scroll.
          # .never = stäng av auto-inseten, vår CSS sköter notchen. Nollar även bounce.
          # CSS/JS kan INTE röra detta (native scrollView). Walka från windows.
          perl -0pi -e 's/func applicationDidBecomeActive\(_ application: UIApplication\) \{/func applicationDidBecomeActive(_ application: UIApplication) {\n        func killBounce(_ v: UIView) {\n            if let sv = v as? UIScrollView { sv.contentInsetAdjustmentBehavior = .never; sv.bounces = false; sv.alwaysBounceVertical = false }\n            v.subviews.forEach(killBounce)\n        }\n        application.windows.forEach(killBounce)\n        DispatchQueue.main.asyncAfter(deadline: .now() + 1) { application.windows.forEach(killBounce) }/' ios/App/App/AppDelegate.swift
          # Misslyckas högt om injektet inte tog (mall ändrad) → slipp falsk patch.
          grep -q killBounce ios/App/App/AppDelegate.swift
          # Push: Capacitor levererar APNs-token via NotificationCenter, men default-
          # AppDelegaten postar den INTE (verifierat även i Capacitor 8-mallen) →
          # register() ger varken token eller fel (tyst).
          # Injicera de två vidarebefordrings-metoderna direkt i klassen.
          perl -0pi -e 's/(class AppDelegate: UIResponder, UIApplicationDelegate \{)/$1\n    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n    }\n    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n    }/' ios/App/App/AppDelegate.swift
          grep -q capacitorDidRegisterForRemoteNotifications ios/App/App/AppDelegate.swift
          # Kamera (skanna kort): WKWebView DÖLJER navigator.mediaDevices.getUserMedia
          # om Info.plist saknar NSCameraUsageDescription → appen visar "Kamera stöds
          # inte här". Lägg till usage-strings (Add faller om nyckeln finns → Set).
          PL=ios/App/App/Info.plist
          CAM='Foilio använder kameran för att skanna dina Pokémon-kort.'
          PHOTO='Foilio öppnar bildbiblioteket så att du kan välja en kortbild att skanna.'
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string \"$CAM\"" "$PL" || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription \"$CAM\"" "$PL"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string \"$PHOTO\"" "$PL" || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription \"$PHOTO\"" "$PL"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PL"
          # Export compliance: appen använder BARA standard-HTTPS = undantagen kryptering.
          # Utan nyckeln laddas bygget upp och bearbetas klart, men TestFlight-inskicket
          # 422:ar ("The build is missing export compliance") → grönt bygge som ALDRIG når
          # testarna. Precis så dog bygge #33. Nyckeln = svaret på Apples exportfråga.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL" || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PL"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PL"
          # PORTRÄTT-LÅS (iPhone): appen är en WebView över den hostade webbappen, och
          # den layouten byter till DESKTOP-läge vid 768px bredd — en iPhone i liggande
          # läge är 844–932px bred, så rotationen visade webbens toppnavigering mitt i
          # appen. ios/ genereras av `cap add ios` ovan → låset MÅSTE sättas HÄR; en
          # ändring i repots Info.plist finns inte ens kvar (ios/ är gitignorerad).
          # ~ipad-nyckeln lämnas orörd: på surfplatta ÄR desktop-layouten rätt.
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PL"
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$PL"
          # Push Notifications: Capacitor lägger inte till aps-environment-entitlementen.
          # Utan den får appen aldrig en APNs-token (registreringen tyst-failar). Skapa
          # entitlement-filen och koppla den till App-targeten (ingen Xcode behövs).
          # "production" = rätt för TestFlight/App Store (de använder produktions-APNs).
          # Sign in with Apple (2026-08-29): capabilityn är påslagen på App ID:t i
          # Developer-portalen; entitlementen här är appens halva. Det nativa
          # SocialLogin-pluginet (lib/social-login.ts) kräver den, annars svarar
          # ASAuthorizationController med error 1000 utan förklaring.
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
            <key>com.apple.developer.applesignin</key>
            <array>
              <string>Default</string>
            </array>
          </dict>
          </plist>
          PLIST
          grep -q applesignin ios/App/App/App.entitlements
          # Google-inloggning (nativt GoogleSignIn-SDK via @capgo/capacitor-social-login):
          # GIDClientID = iOS-klient-id:t (Google Cloud → Clients → "Foilio iOS", bundle
          # se.foilio.app) och URL-schemat är SAMMA id BAKLÄNGES — dit återvänder Googles
          # inloggningsflöde. Saknas de kraschar Google-knappen i appen med "no client ID".
          # Samma id ligger som GOOGLE_IOS_CLIENT_ID i Railway (servern verifierar aud).
          GID="$GOOGLE_IOS_CLIENT_ID"
          test -n "$GID"  # fail-loud: sätt GOOGLE_IOS_CLIENT_ID i Codemagic-miljön
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string \"$GID\"" "$PL" || \
            /usr/libexec/PlistBuddy -c "Set :GIDClientID \"$GID\"" "$PL"
          REV="com.googleusercontent.apps.${GID%%.apps.googleusercontent.com}"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string \"$REV\"" "$PL"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$PL" | grep -q "^com.googleusercontent.apps."
          # TARGETED_DEVICE_FAMILY=1 = iPhone-only. Capacitor-mallen bygger för iPhone OCH
          # iPad (1,2) → Apple kräver då iPad-skärmbilder och GRANSKAR appen på iPad, där
          # layouten aldrig testats. Öppna upp till "1,2" den dag iPad är genomtestad.
          ruby -e 'require "xcodeproj"; p=Xcodeproj::Project.open("ios/App/App.xcodeproj"); t=p.targets.find{|x| x.name=="App"}; t.build_configurations.each{|c| c.build_settings["CODE_SIGN_ENTITLEMENTS"]="App/App.entitlements"; c.build_settings["TARGETED_DEVICE_FAMILY"]="1"}; p.save'
          grep -q aps-environment ios/App/App/App.entitlements  # fail-loud om injektet inte tog
          # Fail-loud om iPhone-only-inställningen inte tog (mall/xcodeproj-API ändrat).
          ruby -e 'require "xcodeproj"; p=Xcodeproj::Project.open("ios/App/App.xcodeproj"); t=p.targets.find{|x| x.name=="App"}; abort("TARGETED_DEVICE_FAMILY not applied") unless t.build_configurations.all?{|c| c.build_settings["TARGETED_DEVICE_FAMILY"]=="1"}'
      - name: Sätt build-nummer
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
          # Marknadsversionen (CFBundleShortVersionString) MÅSTE höjas när en
          # version redan är GODKÄND i App Store: bygge #39 (2026-08-29) byggde
          # grönt men uppladdningen 422:ade med "must contain a higher version than
          # the previously approved version [1.0]". Höj MARKETING_VERSION ovan vid
          # varje släpp efter godkännande — build-numret räcker bara inom en version.
          agvtool new-marketing-version "$MARKETING_VERSION"
      - name: Kodsignering (auto via App Store Connect API-nyckel)
        script: |
          exec > >(tee "$CM_BUILD_DIR/sign.log") 2>&1
          set -x
          keychain initialize
          # Apple ger inte privata nyckeln för befintliga cert → vi förser en egen;
          # --create skapar (och återanvänder) ett distributions-cert från den.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Bygg IPA
        script: |
          exec > >(tee "$CM_BUILD_DIR/build-ipa.log") 2>&1
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - gen-ios.log
      - sign.log
      - build-ipa.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
