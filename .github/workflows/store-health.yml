name: Butiks-hälsokoll (veckovis)

# Hämtar varje restock-bevakad butiksadapter och blir RÖD om någon returnerar 0
# produkter — en adapter som dött tyst (butik bytt plattform/HTML). Larm = GitHub
# mejlar repo-ägaren automatiskt vid röd körning; loggen namnger butiken. Lagar
# INTE adaptern (kräver en människa) — gör bara ett tyst flerveckorsutfall synligt
# inom 7 dagar. Läser bara butiksfeeds + en kort DB-läsning (källistan).
on:
  schedule:
    - cron: "0 6 * * 1" # måndagar 06:00 UTC
  workflow_dispatch: {}

# Minsta möjliga rättighet. INGET jobb i det här repot skriver till GitHub — de läser
# koden och skriver till Neon. Utan blocket får GITHUB_TOKEN repots STANDARD-rättigheter,
# vilket kan vara skrivande, och en komprometterad beroendekedja hade då kunnat pusha.
# ⛔ Inkommande workflow_dispatch (restock-pingern) påverkas INTE: den auktoriseras av
# ANROPARENS token, inte av det här blocket.
permissions:
  contents: read

concurrency:
  group: store-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 60, inte 15: audit-links hämtar VARJE butikslänk (~2 900 efter Wave 4) med 1,5 s
    # per-värd-delay → ~10–15 min bara för det steget. Med taket på 15 CANCELLADES jobbet
    # mitt i audit-links tre veckor i rad (20/7, 27/7, 3/8) och ALLT efter — GTIN-rapport,
    # CM-länkrapporter, gtin-fix, stub-dedup — hoppade tyst. Publikt repo = gratis
    # Actions-minuter; Neon-kostnaden är ~1 CU-h extra i veckan, dvs ören.
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # stub-dedupen (Haiku, ören/vecka)
      # Speglar rapportskriptens fynd till StoreHealthFinding → /admin/halsokoll.
      # BARA här: lokala körningar av samma skript förblir skrivfria (läs-only-kontraktet).
      STORE_HEALTH_DB: "1"
    steps:
      # Samma vakt som restock-watch: utan DATABASE_URL hoppar vi över och lyckas
      # grönt (ingen falsk-röd/mejlspam innan molnhosting är konfigurerad).
      - name: Förkrav — DATABASE_URL måste vara satt
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice::DATABASE_URL saknas — hoppar över tills Neon är konfigurerad."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.guard.outputs.ready == 'true'
        run: npx prisma generate
      - if: steps.guard.outputs.ready == 'true'
        run: npx tsx scripts/check-store-health.ts
      # Länk-revision: butiks-offers vars URL-slug motsäger produkttiteln (serienummer,
      # sifferset, språk). Fångar fel-länkar som matcher-vakterna inte kan laga i
      # efterhand (de vaktar bara NYA matchningar). Röd körning = mejl till ägaren.
      # ⛔ `!cancelled()` KRÄVS HÄR OCKSÅ. Ett `if:` utan statusfunktion får implicit
      # `success()`, så det här steget hoppades tyst så fort check-store-health blev röd
      # — vilket det blir varje vecka en enda butik är onåbar. Länkrevisionen uteblev
      # 2026-08-10 (Fantasia North) och 2026-08-17 (Leksaksaffären): två veckor utan
      # mätning av länk-backloggen, av en blockerad butik som inte har med saken att göra.
      # `be9266d` la villkoret på alla steg från gtin-report och nedåt men missade det här.
      - if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        # `--prune` raderar en död butiks-offer först när TVÅ oberoende signaler pekar
        # åt samma håll: raden har fallit ur butikens feed (>7 dygn) OCH sidan svarar
        # verifierat 404 i den här körningen (ägarbeslut 2026-08-25). En butik som
        # AVVISAR oss (403) rörs aldrig — se REFUSAL_CODES i skriptet.
        run: npx tsx scripts/audit-links.ts --prune
      # ⛔ STEGEN NEDAN KÖR ÄVEN NÄR EN RAPPORT OVANFÖR BLIVIT RÖD (`!cancelled()`):
      # audit-links och underpris-rapporten exit:ar 1 när de HITTAR något — det är
      # larmmekanismen (röd körning = mejl), inte ett skäl att svälta resten. Utan
      # villkoret hoppade gtin-fix och stub-dedupen varje vecka det fanns ETT stående
      # fynd (2026-08-10: 106 döda länkar i backlog efter tre tysta veckor → varje
      # måndag hade dött vid audit-links och underhållet aldrig körts igen).
      # Jobbet blir ändå rött av det fallerade steget — larmet består.
      #
      # GTIN-rapport: felaktiga butikslänkar (samma produkt, motstridiga streckkoder)
      # och katalogdubbletter (olika produkter, samma streckkod) — REN SQL, noll tokens.
      # Körs FÖRE stub-dedupen: streckkoden svarar gratis på den största par-klassen,
      # så LLM:en bara ser de par som faktiskt saknar kod. Läs-only, blir aldrig röd.
      - if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        run: npx tsx scripts/gtin-report.ts
      # CM-enkel-länk-rapport: sealed-produkter vars CM-offer pekar på en SINGEL (fel prisspår).
      # Fångar legacy-fellänkar som refreshens exakt-väg redan avvisar för NYA (men inte städar).
      # Se scripts/cm-single-link-report.ts (2026-07-17: 16 hittade+lagade, bl.a. Venusaur→Surfing Pikachu).
      - if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        run: npx tsx scripts/cm-single-link-report.ts
      # Marknads-underpris: Tradera-offers <15% av CM-priset = falskt/spelat/öppnat ex.
      # Ingest-vakten missar dem när CM-facit själv glitchar (Riolu 19 kr, 2026-07-19) —
      # rapporten kör mot NUVARANDE facit varje vecka. Röd körning = mejl till ägaren.
      - if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        run: npx tsx scripts/marketplace-underprice-report.ts --strict
      # CM-länk-missmatch: sealed vars CM-idProduct FINNS men är FEL vara (spårar fel pris).
      # Titel↔CM-katalognamn-likhet. Informativ (kan ha falska positiva) — granska loggen.
      # Fångar det fuzzy-re-mismatch skapar (Water Stacking Tin→Tapu Lele, Meowth→Tyrantrum).
      - if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        run: npx tsx scripts/cm-link-mismatch-report.ts
      # Rapporterar vad som SKULLE åtgärdas: dubbletter där ingen titelvakt protesterar,
      # och offers vars streckkod ägs av en annan katalogprodukt. Resten hamnar i
      # rapporten + "Fel länk?"-kön för mänsklig granskning.
      #
      # ⛔ `--apply` ÄR AVSIKTLIGT BORTTAGET (2026-08-17). Kommentaren som stod här
      # påstod "RADERAR ALDRIG något". Det var FALSKT för merge-grenen: `mergeStubInto`
      # slutar i `prisma.product.delete` (src/jobs/dedupe-stubs.ts) och raderar dessutom
      # kolliderande butiks-offers i stället för att flytta dem. Körningen 2026-08-17
      # mergade fyra produkter oåterkalleligt — bl.a. "Kanto Friends Mini Tins: Eevee
      # Tin" → "Kanto Friends Mini Tin 5-Pack Bundle", en enstyckstin in i ett
      # 5-pack — utan att någon människa såg det, och loggen sa `0 raderade` eftersom
      # `gtin-fix.ts` hårdkodar `const deleted = 0` och skickar `() => {}` som logger.
      #
      # Vakterna som gatar mergen är 9 av 16: packVsBoxMismatch, cardCountMismatch,
      # premiumGradeMismatch, setCodeMismatch, regionVersionMismatch,
      # blisterCharacterMismatch och deckCharacterMismatch finns i matching.ts men är
      # inte importerade i gtin-fix.ts. `--apply` får återinföras när (a) de sju vakterna
      # är med i GUARDS, (b) faktiska raderingar loggas, och (c) herrelösa offer-URL:er
      # hanteras (orphanedOfferUrlsForMerge) enligt .claude/rules/catalog-curation.md.
      - if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        run: npx tsx scripts/gtin-fix.ts
      # Stub-dedup: auto-importens dubblettprodukter (olika butiksnamn på samma SKU)
      # merge:as LLM-verifierat (Haiku, två titlar/anrop). Se src/jobs/dedupe-stubs.ts.
      # Streckkods-identiska stubbar merge:as redan gratis inuti jobbet (gtinMerges).
      - if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        run: npx tsx scripts/dedupe-stubs-run.ts
