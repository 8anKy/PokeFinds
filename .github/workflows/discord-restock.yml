name: Discord restock-larm (loop-jobb, egen takt per butik)
# Rubriken bär föregångaren ("← <run id>") — grinden och vakten läser den för att skilja
# en överlämning från en andra, felaktig lane. Testkörningar slutar på "(test)".
run-name: ${{ github.event.inputs.test == 'true' && 'discord-restock (test)' || github.event.inputs.handoff_from && format('discord-restock ← {0}', github.event.inputs.handoff_from) || 'discord-restock' }}

# Snabbfil som postar restocks till Discord LÅNGT före mejlet hinner ut.
#
# VARFÖR EN EGEN LANE: 10-min-lanen är inte långsam för att utskicket är långsamt —
# mejl och push skickas redan inne i samma körning som upptäckten (dispatchPendingAlerts
# anropas direkt efter offer-diffen). Flaskhalsen är TAKTEN.
#
# LOOP-I-JOBBET (2026-08-13, ersätter "en körning per dispatch var 2:a minut"):
# Den gamla modellen betalade ~25 s Actions-omkostnad (dispatch→start, boot, checkout,
# cache-restores) PER SVEP — omkostnaden var större än själva feed-hämtningen och
# gick inte att optimera bort per körning. Nu loopar JOBBET i stället, och omkostnaden
# betalas en gång per jobb.
#
# ⛔ SVEPET ÄR BORTTAGET (2026-08-16). Fram till nu hämtades alla butiker parallellt
# och först när den LÅNGSAMMASTE svarat kördes diffen och inläggen gick ut. MÄTT i
# drift: svepet tog 36 s och sattes av Shinycards (35,9 s) och Swepoke (35,0 s) — så
# en butik som svarade på 4 s fick ändå ~32 s ren väntan påklistrad på varje larm,
# dygnet runt, för att två ANDRA butiker är långsamma. Ovanpå det låg ett tickintervall
# på 60 s. Nu har varje butik en EGEN loop (hämta → diffa → posta → vänta ut sin takt)
# och väntar aldrig på någon annan. Uppmätt effekt för en CDN-serverad butik:
# ~66 s snittlatens → ~20 s.
#
# ⛔ TAKTEN VÄLJS INTE, DEN FALLER UT UR ETT ARTIGHETSTAK. Den gamla indelningen var
# per PLATTFORM ("Shopify varje tick, egna servrar varannan"), som om alla feedar
# kostade lika mycket att hämta. De gör inte det: en butik vars hela feed är två
# sidhämtningar och en vars feed är trettio kollektionsanrop fick femton gångers
# skillnad i last utan att någon valt det. Scriptet mäter nu förfrågningarna per
# hämtning (räknare i scrapers/http.ts) och sätter intervallet så att ingen butik får
# mer än en förfrågan per 2,5 s (CDN) respektive 6 s (egen server). Billiga feedar
# pollas därmed OFTARE än förut, dyra mer SÄLLAN, och lasten mot varje butik är känd
# i stället för gissad. Läs pollIntervalMs i src/lib/restock-poll-interval.ts.
#
# GLAPPET MELLAN JOBB är det som återstår: dispatch → runner-tilldelning → checkout →
# cache-restore mättes 2026-08-16 till ~112 s, varav ~95 s är GitHubs egen kö efter
# att jobbet blivit körbart (bara ~17 s är vårt: checkout, node, cache). Det går inte
# att optimera bort — bara amorteras. Loopbudgeten är därför 20 min (~9 % blind tid
# mot ~17 % vid 9-minutersjobb). Glappet KOSTAR INGA LARM, bara latens: nästa jobb
# diffar mot samma state och hittar övergången.
# ✅ SEDAN 2026-10-11 ÖVERLAPPAR JOBBEN i stället (se concurrency-blocket): nästa jobb
# bootar medan det här fortfarande postar och tar över på sekunden.
#
# PINGERN (cron-job.org) BEHÖVS FORTFARANDE: medan ett loop-jobb kör blir dispatchen
# PENDING i concurrency-gruppen, GitHub byter ut den väntande mot varje nyare dispatch
# (någon "avbruten" körning per jobb i historiken — kosmetiskt), och när jobbet slutar
# startar nästa direkt = sömlös kedja med självläkning om ett jobb dör.
# ⚠️ MED 20-MINUTERSJOBB GER 2-MINUTERSPINGEN ~10 AVBRUTNA KÖRNINGAR PER JOBB. Sätt
# gärna pingern till var 5:e minut i stället: samma latens (den enda som räknas är att
# EN dispatch står och väntar när jobbet slutar), renare historik, och en död lane
# självläker fortfarande inom fem minuter. Ägarens val, noll kostnad åt båda håll.
#
# ⛔ DEN RÖR ALDRIG DATABASEN, OCH DET ÄR VILLKORET FÖR ATT DEN SKA VARA GRATIS.
# Neon debiteras per VAKEN TID och varje väckning köper minst 300 s. Skulle den här
# lanen väcka computen var 2:a minut vore den dyrare än allt annat vi kör tillsammans —
# det var precis därför 2-minuters-snabbfilen togs bort 2026-08-09.
# Två spärrar håller invarianten:
#   1. `shouldProcess` returnerar ALLTID false i scripts/discord-restock-run.ts, så
#      runRestockScan stannar efter fas 1 (ren HTTP) och når aldrig ensureDbAwake().
#   2. DATABASE_URL nedan pekar med FLIT på en oåtkomlig adress. Skulle någon någon
#      gång lägga in en DB-fråga här dör körningen omedelbart och SYNLIGT i stället för
#      att tyst börja kosta pengar. Sätt aldrig in den riktiga strängen.
#
# Källistan och ruttabellen (butiks-URL → vår produkt/set/serie) kommer från
# .restock-routes/routes.json, som export-restock-routes.ts skriver i scrape-alls
# fönster där Neon ändå är vaken. Saknas filen hoppar körningen över.
#
# TRIGGER: samma lärdom som restock-watch.yml — GitHub `schedule:`-cron är best effort
# och kördes i praktiken var 1,5–3,5 h trots "*/10". Riktig takt kräver en EXTERN cron
# (cron-job.org) som POST:ar till GitHub-API:t var 2:a minut:
#   POST https://api.github.com/repos/8anKy/PokeFinds/actions/workflows/discord-restock.yml/dispatches
#   headers: Authorization: Bearer <PAT (Actions: read+write)>, Accept: application/vnd.github+json
#   body: {"ref":"main"}
on:
  schedule:
    - cron: "0 * * * *" # RESERV om pingern dör. Ger timmes-takt, inte 2-minuters.
  workflow_dispatch:
    inputs:
      test:
        description: "Posta ett testinlägg i varje kanal och sluta (rör inga feedar)"
        type: boolean
        default: false
      test_channel:
        description: "Bara denna kanal-id (kräver test=true). Tomt = alla kanaler."
        type: string
        required: false
        default: ""
      handoff_from:
        description: "Sätts av lanen själv (överlämningen) — lämna tomt vid manuell start."
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Samma skäl som restock-watch: en avbruten körning sparar ALDRIG sin cache
# (post-steget hoppas vid cancel), och utan cache seedar nästa körning om sitt
# lagerläge och tappar flapp-historiken.
#
# ⛔ TESTLÄGET HAR EN EGEN GRUPP (2026-08-16). GitHub håller bara EN väntande körning
# per concurrency-grupp och byter ut den mot varje nyare dispatch. Pingern fyrar var
# 2:a minut, så en MANUELL testkörning hann aldrig starta — den blev pending och
# ersattes inom två minuter, varje gång (verifierat: conclusion "cancelled" utan en
# enda loggrad). Testet var alltså i praktiken omöjligt att köra medan lanen levde,
# vilket är precis tvärtemot varför det finns.
# Det är ofarligt att låta det gå vid sidan av: `--test` rör varken feedar eller
# state-filen, så det finns ingenting att serialisera mot driftkörningen.
#
# ── ÖVERLAPPET (2026-10-11) ───────────────────────────────────────────────────────
# Mellan två jobb var lanen BLIND ~1,5 min var 20:e minut (förra jobbets sista hämtning
# → GitHubs kö → boot → nästa jobbs första hämtning). 2026-10-11 15:00 fylldes Speltrollet
# på exakt i glappet; en konkurrent postade 15:00, vi 15:01:19. Nu:
#   1. Lanen skriver en ögonblicksbild 6 min före sitt slut (DISCORD_RESTOCK_HANDOFF_SECONDS)
#      och fortsätter posta. `post` sparar cachen MITT I jobbet (lanen kör i bakgrunden).
#   2. `handoff`-jobbet ser cachen och startar nästa körning med handoff_from=<detta id>.
#   3. Nästa körning återställer bilden, VÄNTAR till det här jobbets slut (`cutoverAt`) och
#      tar över på sekunden. Det den hade postat dubbelt (allt vi postade efter bilden)
#      hoppar den över genom att läsa kanalerna (src/lib/discord-restock-ledger.ts).
# ⛔ DÄRFÖR FÅR ÖVERLÄMNINGAR EN EGEN concurrency-grupp per körning — i den gemensamma
#    gruppen hade nästa jobb stått och väntat på att det här slutade, dvs glappet igen.
#    Kalla starter (pingern, schemat) delar fortfarande EN grupp, och `gate` släpper bara
#    in en kall start när ingen lane lever. `post` har dessutom en vakt som stoppar en
#    andra lane inom en minut om grinden ändå skulle racea (lägst körnings-id vinner).
concurrency:
  group: discord-restock${{ github.event.inputs.test == 'true' && '-test' || github.event.inputs.handoff_from && format('-h-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  # ── GRINDEN: BLIR DEN HÄR KÖRNINGEN LANEN? (2026-10-11) ────────────────────────
  # Kall start (pingern/schemat): bara om INGEN annan lane-körning lever — under en
  # överlämning lever två, och då ska pingern tiga. Överlämning (handoff_from=X): om ingen
  # ANNAN lane än föregångaren X kör. Körningar äldre än 40 min räknas som hängda.
  # ⛔ Inga hemligheter, ingen checkout — bara `gh` mot Actions-API:t (läsrätt).
  gate:
    if: github.event.inputs.test != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ME: ${{ github.run_id }}
      FROM: ${{ github.event.inputs.handoff_from }}
    steps:
      - id: gate
        run: |
          set -uo pipefail
          now=$(date +%s)
          # API-fel: en överlämning går ändå (vakten i `post` stoppar en ev. dubblett),
          # en kall start avstår (pingern försöker igen om 2 min).
          if ! runs=$(gh api "repos/$GH_REPO/actions/workflows/discord-restock.yml/runs?per_page=40" \
            | jq -r --argjson me "$ME" '.workflow_runs[]
                | select(.id != $me)
                | select(.status == "in_progress" or .status == "queued")
                | select((.display_title // "") | endswith("(test)") | not)
                | "\(.id) \(.run_started_at // .created_at)"'); then
            if [ -n "$FROM" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
            echo "::warning::Grinden kunde inte läsa körningarna (föregångare: ${FROM:-ingen})."
            exit 0
          fi
          go=true
          while read -r id started; do
            [ -z "${id:-}" ] && continue
            age=$(( now - $(date -d "$started" +%s) ))
            if [ "$age" -gt 2400 ]; then echo "Ignorerar körning $id (${age} s gammal — hängd?)."; continue; fi
            [ -n "$FROM" ] && [ "$id" = "$FROM" ] && continue
            # ⛔ EN KÄLL START SOM AVSTÅTT ÄR INGEN LANE (2026-10-19): dess överhoppade jobb kan
            #    hålla körningen "in_progress" i 15–25 min. Räknades den som levande avstod nästa
            #    kalla start också, som höll nästa vid liv … — lanen stod still 15:44 → 16:50 UTC
            #    (Spel & Sånt-påfyllningen 16:13 postades 16:50). Bara en körning vars grind ännu
            #    inte avgjort, eller vars `post` köar/kör, blockerar. API-fel ⇒ räknas som levande.
            if ! jobs=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" 2>/dev/null); then
              echo "Körning $id: jobben gick inte att läsa — avstår."; go=false; break
            fi
            gate_st=$(jq -r '[(.jobs // [])[] | select(.name == "gate") | .status][0] // ""' <<< "$jobs" || echo "")
            post_st=$(jq -r '[(.jobs // [])[] | select(.name == "post") | .status][0] // ""' <<< "$jobs" || echo "")
            post_concl=$(jq -r '[(.jobs // [])[] | select(.name == "post") | .conclusion][0] // ""' <<< "$jobs" || echo "")
            if [ "$post_st" = "in_progress" ]; then echo "Körning $id är redan lanen — avstår."; go=false; break; fi
            if [ -z "$FROM" ]; then
              if [ "$gate_st" != "completed" ]; then echo "Kall start: körning $id har grinden kvar — avstår."; go=false; break; fi
              if [ "$post_st" != "completed" ] || [ "$post_concl" = "success" ]; then
                echo "Kall start: körning $id kan bli lanen (post: ${post_st:-?}/${post_concl:-?}) — avstår."; go=false; break
              fi
              echo "Ignorerar körning $id (avstod — post ${post_concl:-?})."
            fi
          done <<< "$runs"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Grind: go=$go (föregångare: ${FROM:-ingen})."

  # ── VÄCKARKLOCKAN FÖR NATTJOBBEN (2026-09-28) ─────────────────────────────────
  # GitHubs `schedule:` är best effort och går 3–5 h sent i vår drift (cardmarket-refresh
  # "13:00" startade 16:48–17:37 UTC vecka 39; scrape-all "02:00" 06:58–08:05). Lanen
  # startar ett nytt jobb var ~20:e minut dygnet runt, så den får starta nattjobben på
  # klockslaget i stället. GITHUB_TOKEN får trigga workflow_dispatch (det enda
  # event-slaget GitHub tillåter från ett workflow) — ingen PAT, ingen extern tjänst.
  # ⛔ EGET JOBB MED EGEN RÄTTIGHET: `actions: write` ska inte ligga på jobbet som läser
  #    butikernas feedar och kör hela npm-trädet. Det här jobbet kör bara `gh`.
  # ⛔ EN START PER DYGN: "finns en körning skapad sedan klockslaget?" (alla statusar,
  #    även köade) — annars startas den. Fönstret är brett så en lane som legat nere
  #    ändå startar jobbet när den kommer tillbaka.
  # ⛔ Bara när körningen BLEV lanen: pingerns kalla starter avstår i grinden var 2:a
  #    minut under en överlämningskedja, och store-social hade annars startats lika ofta.
  kickoff:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Starta nattjobb som inte startats än
        run: |
          set -euo pipefail
          kick() { # workflow-fil, ISO-tid sedan när
            n=$(gh run list -w "$1" --created ">=$2" --limit 20 --json databaseId -q 'length')
            if [ "$n" = "0" ]; then
              gh workflow run "$1" --ref main
              echo "::notice::Väckarklockan startade $1 (ingen körning sedan $2)."
            else
              echo "$1: redan startad sedan $2 ($n körning(ar))."
            fi
          }
          h=$((10#$(date -u +%H)))
          # Cardmarket-priser 01:00 UTC: färdigt ~02:00, långt före morgonen och före
          # nattkedjan (scrape-all, som i praktiken startar ~07 UTC). Fönster till 12 UTC.
          # "Sedan" = 00:00 UTC IDAG: pristabellens dygnsnyckel är UTC-datumet, så varje
          # UTC-dygn behöver en egen körning. (Ett 20 h-fönster 09-29 lät en manuell körning
          # 23:39 dagen innan äta upp dygnets körning ⇒ inget värde för den 29:e.)
          if [ "$h" -ge 1 ] && [ "$h" -lt 12 ]; then
            kick cardmarket-refresh.yml "$(date -u +%F)T00:00:00Z"
          fi
          # Morgonrundan för nattens prislarm (tysta timmar, lib/quiet-hours.ts): 07–10
          # svensk tid, sommar- och vintertid via TZ.
          sh=$((10#$(TZ=Europe/Stockholm date +%H)))
          if [ "$sh" -ge 7 ] && [ "$sh" -lt 10 ]; then
            since=$(date -u -d "@$(TZ=Europe/Stockholm date -d "$(TZ=Europe/Stockholm date +%F) 07:00" +%s)" +%FT%TZ)
            kick morning-alerts.yml "$since"
          fi
          # Butiksnyheter (Instagram → Discord, store-social.yml): VARJE kickoff, dvs var
          # ~20:e minut. DB-fri; Metas tak (200/h) räknat i store-social.yml. Ett fel här
          # får inte fälla nattjobbens väckarklocka ovan.
          gh workflow run store-social.yml --ref main || echo "::warning::Kunde inte starta store-social.yml"

  post:
    needs: gate
    # `always()` för testläget: då hoppas grinden över, och utan always() hade ett
    # hoppat beroende hoppat även det här jobbet.
    if: always() && (github.event.inputs.test == 'true' || needs.gate.outputs.go == 'true')
    runs-on: ubuntu-latest
    # Boot (~1 min) + väntan på föregångarens slut (≤ ~6 min) + loopbudgeten 1200 s + en
    # butiks sista varv. Taket är ett skyddsräcke mot en hängd körning; grinden räknar en
    # körning äldre än 40 min som hängd och släpper då in en kall start.
    timeout-minutes: 35
    # Vakten (dubbla laner) läser Actions-API:t.
    permissions:
      contents: read
      actions: read
    env:
      # ⛔ AVSIKTLIGT OÅTKOMLIG. Se filhuvudet. PrismaClient konstrueras vid import av
      # runner.ts; en syntaktiskt giltig men död URL låter konstruktionen lyckas och
      # gör varje faktisk fråga till ett omedelbart, högljutt fel.
      DATABASE_URL: "postgresql://disabled:disabled@127.0.0.1:1/disabled"
      # ── LARM-HITS: MEJL + PUSH VIA APPEN (2026-09-06) ─────────────────────────
      # Lanen är det enda som ser en påfyllning inom sekunder, och den får aldrig röra
      # Neon. I stället POST:ar den varje påfyllning den postar om en KÄND produkt till
      # appens /api/cron/restock-hit (x-cron-secret), som väcker databasen, slår upp
      # bevakarna och skickar mejl/push. Neon vaknar alltså bara när något faktiskt
      # fyllts på — mätt 09-05: 12 distinkta 5-minutersfönster per dygn (≈ 1 h vaken
      # tid som tak) mot 18,8 h/dygn för den pausade 10-minuterslanen restock-watch.
      # ⛔ DATABASE_URL ovan FÖRBLIR DÖD: hitsen går via HTTP, aldrig via Prisma.
      # ⛔ PÅ/AV STYRS I RAILWAY, inte här: RESTOCK_ALERTS_PAUSED=0 där ⇒ appen skapar
      #    larm; annars svarar den "paused" utan att röra databasen och lanen slänger
      #    hitsen. Tom hemlighet ⇒ lanen skickar inget (loggar en rad vid start).
      # Misslyckade leveranser (Railway mitt i en självomstart, GitHub-glapp) köas i
      # .discord-restock-cache/hits.json (TTL 2 h, samma som larmens cooldown).
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DISCORD_RESTOCK_ENABLED: ${{ vars.DISCORD_RESTOCK_ENABLED }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      # Kanal-id:n är INGA hemligheter (till skillnad från webhook-URL:er, som är rena
      # bärartokens) → repo-VARIABLER, inte secrets. Format:
      #   {"default":"<kanal-id>","series":{"Mega Evolution":"<id>","Scarlet & Violet":"<id>"}}
      # Valfritt: "prices":"<kanal-id>" samlar ALLA prissänkningsinlägg i EN kanal i
      # stället för att blanda dem med påfyllningarna i set-/seriekanalerna.
      DISCORD_RESTOCK_CHANNELS: ${{ vars.DISCORD_RESTOCK_CHANNELS }}
      # Tom → default-listan i scriptet (de åtta mest aktiva butikerna, mätt).
      # "all" = alla bevakade. Läs artighetsresonemanget i scriptet innan du sätter "all".
      DISCORD_RESTOCK_STORES: ${{ vars.DISCORD_RESTOCK_STORES }}
      # ── PRISSÄNKNINGSLARM (2026-08-21) ────────────────────────────────────────
      # Alla fyra är TOMMA som default och faller då tillbaka på kodens gränser
      # (≥5 % OCH ≥10 kr, tak 60 %, högst 8 per butik och hämtning, 12 h cooldown).
      # ⛔ EN TOM VARIABEL ÄR "OSATT", INTE "AV" — `pricePolicy()` trimmar och
      #    ignorerar tomma värden med flit, för `${{ vars.X }}` blir en tom STRÄNG när
      #    repo-variabeln inte finns. Sätt "false" för att faktiskt stänga av.
      # ⚠️ Gränserna är satta i underkant UTAN att vara mätta på vår egen trafik: lanen
      #    har aldrig sparat priser förut, så det finns ingen historik att räkna på.
      #    Körningsloggen namnger både postade och fällda prisfall (`pris: …`) — justera
      #    på DE talen. Volymen första dygnet är också svaret på om prisinläggen ska ha
      #    en EGEN kanal ("prices" i DISCORD_RESTOCK_CHANNELS) i stället för att dela
      #    set-/seriekanalerna med påfyllningarna.
      DISCORD_PRICE_DROPS_ENABLED: ${{ vars.DISCORD_PRICE_DROPS_ENABLED }}
      DISCORD_PRICE_DROP_MIN_PERCENT: ${{ vars.DISCORD_PRICE_DROP_MIN_PERCENT }}
      DISCORD_PRICE_DROP_MIN_ORE: ${{ vars.DISCORD_PRICE_DROP_MIN_ORE }}
      DISCORD_PRICE_DROP_MAX_PER_STORE: ${{ vars.DISCORD_PRICE_DROP_MAX_PER_STORE }}
      # Loop-i-jobbet: totalbudget 20 min. Varje BUTIK har sin egen takt inuti (se
      # filhuvudet); det här talet styr bara hur länge jobbet lever.
      #
      # 540 → 1200 (2026-08-16): mellan två jobb är lanen BLIND medan nästa dispatch
      # tilldelas en runner och bootar — MÄTT till ~112 s, varav ~95 s är GitHubs egen
      # kö. Det glappet går inte att optimera bort, bara amorteras: ~17 % blind tid vid
      # 9-minutersjobb, ~9 % vid 20-minutersjobb. Samma antal jobb-omkostnader betalas
      # över dubbelt så lång täckning. ⛔ Höj inte vidare utan att väga in att ett
      # HÄNGT jobb blockerar lanen tills timeout-minutes löper ut.
      DISCORD_RESTOCK_LOOP_SECONDS: "1200"
      # ÖVERLAPPET (2026-10-11, se concurrency-blocket): ögonblicksbilden skrivs så här
      # många sekunder före loopens slut. Måste täcka cache-sparning + handoff-jobbets
      # pollning + GitHubs kö (två jobb: gate, post) + boot — mätt kö ~95 s per jobb.
      # För kort ⇒ nästa jobb hinner inte fram (glappet tillbaka, men inga dubbletter);
      # längre kostar bara tomgång i nästa jobb.
      DISCORD_RESTOCK_HANDOFF_SECONDS: "360"
      # ── DÄMPNINGEN I KANALERNA, LÖSARE ÄN I APPEN (ägarbeslut 2026-09-17) ──────────
      # Släppdagen för 30th Celebration: Alphaspel öppnade Poster Collection 13:35, 14:05
      # och 14:29 (varje våg en äkta bokningsbar period). Vi postade 13:35; 14:05 åt den
      # 2-timmars cooldownen (`1 cooldown` i loggen) och 14:29 blinkfönstret på 20 min
      # (`1 blink/flapp`). Konkurrentens kanal postade alla tre. Kanalen är den yta där
      # varje våg ÄR nyheten — läsaren har ingen bevakning, bara flödet.
      # ⛔ GÄLLER BARA LANEN. Appens push/mejl (`checkRestockAlerts`) har sin egen 2 h-
      #    cooldown + flappregel via `flapPolicy()` — de här env-variablerna sätts inte
      #    i Railway, så användarnas telefoner blir inte högljuddare av det här.
      # ⛔ Flapptaket står kvar som spamgolv men är 40/dygn (12 → 40 samma dag): Alphaspels
      #    Poster Collection öppnade och stängde var 20–30:e minut hela släppdagen och slog
      #    i 12 vid ~16:00 — 16:33-vågen loggades som `1 cooldown` (24 h-muten) medan
      #    konkurrenten postade. Med 15-minuterscooldownen ovan är 40 ändå ett golv långt
      #    under vad en het vara kan ge på ett dygn (max 96), och en butik som pytsar var
      #    5:e minut dygnet runt (Dragon's Lair 45 flippar/3 dygn) tystas fortfarande.
      RESTOCK_ALERT_COOLDOWN_HOURS: "0.25"
      RESTOCK_MIN_AWAY_MINUTES: "5"
      RESTOCK_FLAP_MAX_TRANSITIONS: "40"
      # KORT VÅG (2026-10-06): låg varan i lager < 5 min FÖRRA gången (ett ex ur en
      # övergiven kassa, köpt direkt) väntar nästa inlägg om samma URL 60 min i stället
      # för 15. Toyspace Mini Tin Display postades 12:23, 12:39 och 12:58 med 1–2 min i
      # lager varje gång. En våg som ligger kvar ≥ 5 min påverkas inte.
      # ⛔ BARA de butiker som står här (ägarbeslut: bara Toyspace spammar). Källnamn,
      #    kommaseparerat — lägg till en butik först när den visar samma mönster.
      RESTOCK_SHORT_WAVE_STORES: "Toyspace"
      RESTOCK_SHORT_WAVE_MINUTES: "5"
      RESTOCK_SHORT_WAVE_COOLDOWN_MINUTES: "60"
      # BEKRÄFTELSE (2026-10-07): 60-minutersspärren räckte inte — Toyspace släppte samma
      # ENDA ex ungefär varje timme (30th Bundle 07-10: 05:19, 06:20, 07:26, 13:02, 15:01,
      # 2–5 min i lager varje gång) och varje våg låg strax utanför spärren. Kommer varan
      # tillbaka efter en kort våg postas den först när den legat kvar så här länge. Ett
      # ex som säljs inom minuten blir aldrig ett inlägg (och aldrig en push/mejl); en äkta
      # påfyllning postas med högst ~5 min fördröjning. Samma butikslista som ovan.
      RESTOCK_SHORT_WAVE_CONFIRM_MINUTES: "5"
      # ⛔ WEBHALLEN VAR SVANSEN I SVEPET. MÄTT 2026-08-15: hela svepet över 42 butiker
      # tog 54,4 s och Webhallen ensam 52,3 s av dem — dess live-koll slår upp varje
      # icke-i-lager-produkt (~48 st) sekventiellt med 800 ms paus. Sedan svepet ersatts
      # av per-butiks-loopar bromsar den bara SIG SJÄLV, men rotationen är fortfarande
      # rätt: 16 per hämtning betyder att varje produkt kollas var tredje varv (~3 min)
      # — långt under de ~50 min sökindexet släpar, vilket var hela skälet till
      # live-kollen.
      # ⛔ Sätts BARA här. scrape-all och restock-watch kör EN hämtning per process och
      #    behåller defaulten (80 = alla) — där finns inget nästa varv att rotera till.
      WEBHALLEN_LIVE_POLL_MAX: "16"
      NEXT_PUBLIC_APP_URL: "https://scoutr.se"
    steps:
      # Hoppa tyst och grönt när integrationen är avstängd — annars kör vi checkout
      # och npm var 2:a minut för att göra ingenting.
      - name: Förkrav — integrationen måste vara påslagen
        id: guard
        run: |
          if [ "${DISCORD_RESTOCK_ENABLED}" != "true" ]; then
            echo "::notice::DISCORD_RESTOCK_ENABLED != true — hoppar över. Förväntat = grön körning."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${DISCORD_BOT_TOKEN}" ] || [ -z "${DISCORD_RESTOCK_CHANNELS}" ]; then
            echo "::notice::DISCORD_BOT_TOKEN eller DISCORD_RESTOCK_CHANNELS saknas — hoppar över."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Ingen git-operation efter checkout; token ska inte ligga kvar i .git/config.
          persist-credentials: false

      # EGEN cache-nyckel. ⛔ Dela ALDRIG `.restock-cache`/`restock-fp-` med
      # restock-watch.yml: lanarna skulle läsa och skriva varandras lagerläge, och
      # både missade och dubblerade larm hade blivit tysta fel.
      #
      # ⛔ TESTLÄGET RÖR INTE CACHEN — OCH DET ÄR EN KORREKTHETSREGEL, INTE SNÅLHET.
      # `--test` läser aldrig och skriver aldrig state-filen, men cache-steget gjorde
      # det åt den: körningen RESTAURERADE ett lagerläge och SPARADE tillbaka det under
      # en NYARE nyckel. Sedan testet fick en egen concurrency-grupp kan det överlappa
      # driften, och då blir det farligt: avslutar en driftkörning med färskt state
      # medan testet håller en äldre kopia, skriver testet tillbaka den ÄLDRE kopian
      # sist — och nästa driftkörning restaurerar den och diffar mot inaktuellt
      # lagerläge. Följden är dubbelpostade eller missade påfyllningar, tyst.
      - if: steps.guard.outputs.ready == 'true' && github.event.inputs.test != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .discord-restock-cache
          key: discord-restock-state-${{ github.run_id }}
          restore-keys: |
            discord-restock-state-

      # Ruttabellen — BARA restore. Den skrivs av scrape-all (export-restock-routes.ts).
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .restock-routes
          key: restock-routes-
          restore-keys: |
            restock-routes-

      # ⛔ Ingen `cache: npm` här: node_modules-cachen nedan träffar nästan alltid, och
      # ~/.npm-restoren var då en död restore per jobb. På nm-miss blir npm ci långsammare
      # en enda gång — rätt byte för en lane som bootar dygnet runt.
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      # Samma nyckel som de andra lanarna → delad, varm cache (sparar ~35 s/körning).
      - if: steps.guard.outputs.ready == 'true'
        id: nm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}
      - if: steps.guard.outputs.ready == 'true' && steps.nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.guard.outputs.ready == 'true' && steps.nm.outputs.cache-hit != 'true'
        run: npx prisma generate
      # `test`-läget hoppar över feed-hämtningen helt och postar bara en märkt rad per
      # kanal — kör det efter varje kanaländring, annars upptäcks ett rättighetsfel
      # först när en riktig påfyllning uteblir.
      # ⛔ Kanal-id:t skickas via ENV, inte interpolerat rakt in i kommandoraden.
      #    `inputs.*` är fritext från den som startar körningen; klistras den in i
      #    `run:` blir den skalkod. Här är det bara en variabel scriptet läser.
      - if: steps.guard.outputs.ready == 'true' && github.event.inputs.test == 'true'
        env:
          TEST_CHANNEL: ${{ inputs.test_channel }}
        run: |
          args="--test"
          if [ -n "$TEST_CHANNEL" ]; then args="$args --test-channel=$TEST_CHANNEL"; fi
          npx tsx scripts/discord-restock-run.ts $args

      # ── LANEN I BAKGRUNDEN (överlappet, 2026-10-11) ────────────────────────────
      # Lanen måste fortsätta posta MEDAN cachen sparas (ögonblicksbilden), och steg körs
      # i tur och ordning — därför startas den i bakgrunden och de följande stegen följer
      # loggen. `setsid` ger en egen processgrupp så vakten kan stoppa hela trädet
      # (npx → tsx → node). Utgångskoden skrivs till .lane.exit.
      # ⛔ GH_TOKEN står INTE i det här stegets miljö: lanen kör hela npm-trädet och ska
      #    inte ärva en token.
      - if: steps.guard.outputs.ready == 'true' && github.event.inputs.test != 'true'
        name: Starta lanen
        run: |
          setsid nohup bash -c 'npx tsx scripts/discord-restock-run.ts; echo $? > .lane.exit' \
            > .lane.log 2>&1 < /dev/null &
          echo $! > .lane.pid
          echo "Lanen startad (pid $(cat .lane.pid))."

      # VAKTEN: lever en ANNAN lane med lägre körnings-id (inte föregångaren) är den här
      # körningen en dubblett — grinden kan racea mot en kall start. Stoppa vår lane inom
      # en minut; den äldre fortsätter. Efterträdare har alltid högre id och berörs inte.
      - if: steps.guard.outputs.ready == 'true' && github.event.inputs.test != 'true'
        name: Vakt mot dubbla laner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ME: ${{ github.run_id }}
          FROM: ${{ github.event.inputs.handoff_from }}
        run: |
          export PID=$(cat .lane.pid)
          nohup bash -c '
            while kill -0 "$PID" 2>/dev/null; do
              sleep 60
              ids=$(gh api "repos/$GH_REPO/actions/workflows/discord-restock.yml/runs?status=in_progress&per_page=20" 2>/dev/null \
                | jq -r --argjson me "$ME" ".workflow_runs[] | select(.id < \$me) | select((.display_title // \"\") | endswith(\"(test)\") | not) | .id" 2>/dev/null) || continue
              for id in $ids; do
                [ "$id" = "$FROM" ] && continue
                st=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" 2>/dev/null | jq -r "[.jobs[] | select(.name == \"post\") | .status][0] // \"\"" 2>/dev/null)
                if [ "$st" = "in_progress" ]; then
                  echo "[vakt] Körning $id är redan lanen (lägre id) — stoppar den här." >> .lane.log
                  kill -TERM -- -"$PID" 2>/dev/null
                  exit 0
                fi
              done
            done' > /dev/null 2>&1 < /dev/null &
          echo "Vakten startad."

      - if: steps.guard.outputs.ready == 'true' && github.event.inputs.test != 'true'
        id: wait
        name: Lanen (till ögonblicksbilden)
        run: |
          PID=$(cat .lane.pid)
          tail -n +1 -f .lane.log --pid="$PID" &
          TP=$!
          while kill -0 "$PID" 2>/dev/null && [ ! -f .discord-restock-handoff.ready ]; do sleep 2; done
          sleep 1
          kill "$TP" 2>/dev/null || true
          echo "lines=$(wc -l < .lane.log)" >> "$GITHUB_OUTPUT"
          if [ -f .discord-restock-handoff.ready ]; then echo "snapshot=true" >> "$GITHUB_OUTPUT"; fi

      # Ögonblicksbilden. Egen nyckel (…-h); nästa jobb återställer på prefixet och får den
      # nyaste — den här, eftersom vår egen slutsparning skapas först när vi är klara.
      # State-filen skrivs atomärt (temp + rename), så tar läser aldrig en halv fil.
      - if: steps.wait.outputs.snapshot == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .discord-restock-cache
          key: discord-restock-state-${{ github.run_id }}-h

      - if: steps.guard.outputs.ready == 'true' && github.event.inputs.test != 'true'
        name: Lanen (till slut)
        env:
          LINES_DONE: ${{ steps.wait.outputs.lines }}
        run: |
          PID=$(cat .lane.pid)
          tail -n +$(( ${LINES_DONE:-0} + 1 )) -f .lane.log --pid="$PID"
          code=$(cat .lane.exit 2>/dev/null || true)
          if [ -z "$code" ]; then
            echo "::notice::Lanen stoppades utan utgångskod (vakten eller avbrott)."
            exit 0
          fi
          exit "$code"

  # ── ÖVERLÄMNINGEN: STARTA NÄSTA JOBB NÄR ÖGONBLICKSBILDEN FINNS (2026-10-11) ────
  # Eget jobb med skrivrätt på Actions (samma skäl som kickoff: `actions: write` ska inte
  # ligga på jobbet som kör npm-trädet). Sover tills bilden kan finnas, pollar sedan cachen.
  handoff:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ME: ${{ github.run_id }}
    steps:
      - name: Starta nästa lane när ögonblicksbilden är sparad
        run: |
          set -uo pipefail
          # Tidigast: boot (~1 min) + loopbudget 20 min − överlämning 6 min ≈ 15 min.
          sleep 780
          for i in $(seq 1 150); do
            n=$(gh cache list --key "discord-restock-state-$ME-h" --json key -q 'length' 2>/dev/null || echo 0)
            if [ "${n:-0}" != "0" ]; then
              gh workflow run discord-restock.yml --ref main -f handoff_from="$ME"
              echo "::notice::Ögonblicksbilden sparad — nästa lane startad (handoff_from=$ME)."
              exit 0
            fi
            # GITHUB_TOKEN har 1 000 anrop/h per repo (delat med grinden + vakten) —
            # jobbstatusen bara varje minut.
            if [ $(( i % 6 )) -eq 0 ]; then
              # ⛔ `|| true` + `.jobs // []`: ett API-fel (2026-10-19 15:34) gav jq exit 5, bash -e
              #    dödade steget och nästa lane startades aldrig.
              st=$(gh api "repos/$GH_REPO/actions/runs/$ME/jobs" 2>/dev/null | jq -r '[(.jobs // [])[] | select(.name == "post") | .status][0] // ""' 2>/dev/null || true)
              if [ "$st" = "completed" ]; then
                echo "::notice::Lanen slutade utan ögonblicksbild — pingern tar nästa start."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::warning::Ingen ögonblicksbild inom tidsfönstret."
