name: Tradera sålt-synk (dagligen)

# Tar bort samlingsobjekt vars Tradera-annons har sålts (matchar på objektnr mot
# säljarens transaktioner). Körs i molnet — datorn behöver inte vara på.
# ── LÄNKAD TILL FÖREGÅENDE JOBB, INTE TILL KLOCKAN (2026-08-05) ──────────────
# Neons nota är VAKEN TID, och varje väckning köper minst 300 s debiterad tid. Fyra
# nattjobb på egen cron (02:00 / 04:00 / 05:00 / 05:30) väckte computen FYRA gånger,
# spritt över ~3 timmar — och eftersom GitHubs cron dessutom släpar 1,5–3,5 h låg de i
# praktiken ännu glesare. Kedjade i stället: ett sammanhängande fönster, en väckning.
# Mellanrummet (runner-kö + checkout + npm ci) är minuter, alltså långt under
# autosuspendens 300 s, så Neon hinner aldrig somna mitt i kedjan.
#
# ⛔ INGEN `conclusion`-grind. Jobben är OBEROENDE av varandra — de delar bara
#    tidsfönster. Gatade vi på `success` hade ett misslyckat Tradera-svep tyst dödat
#    de tre efterföljande jobben, dvs bytt en synlig röd körning mot tre osynligt
#    uteblivna. `types: [completed]` fyrar oavsett utfall.
# ⛔ `workflows:` MATCHAR PÅ `name:`-FÄLTET i det andra filen, inte på filnamnet.
#    Byter du namn på uppströmsjobbet bryts kedjan TYST och det här jobbet slutar
#    köras helt. Byt då namnet på båda ställena i samma commit.
on:
  workflow_run:
    workflows: ["CardTrader-varianter (dagligen)"]
    types: [completed]
  workflow_dispatch: {}

# Minsta möjliga rättighet. INGET jobb i det här repot skriver till GitHub — de läser
# koden och skriver till Neon. Utan blocket får GITHUB_TOKEN repots STANDARD-rättigheter,
# vilket kan vara skrivande, och en komprometterad beroendekedja hade då kunnat pusha.
# ⛔ Inkommande workflow_dispatch (restock-pingern) påverkas INTE: den auktoriseras av
# ANROPARENS token, inte av det här blocket.
permissions:
  contents: read

concurrency:
  group: tradera-sold-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Rymmer BÅDE synken och sålt-svepet (sista steget). Svepet matchar numera
    # ~10k avslutade annonser/dygn mot katalogen och kan ta uppåt en timme.
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL: "10"
      TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
      TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
    steps:
      # Self-healing-vakt: hoppa över grönt tills DATABASE_URL-secret finns.
      - name: Förkrav — DATABASE_URL måste vara satt
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice::DATABASE_URL saknas — hoppar över tills Neon är konfigurerad."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.guard.outputs.ready == 'true'
        run: npx prisma generate
      - if: steps.guard.outputs.ready == 'true'
        run: npx tsx scripts/tradera-sold-sync.ts

      # ── SÅLT-SVEPET BOR HÄR SOM ETT STEG, INTE SOM ETT FEMTE KEDJELED ────────
      # GitHub fyrar `workflow_run` högst TRE nivåer djupt från roten. Kedjan
      # scrape-all → tradera-sweep → cardtrader-refresh → det här jobbet är redan
      # tre led — ett fjärde (tradera-sold-sweep.yml på workflow_run) fyrar ALDRIG,
      # tyst. Mätt 2026-08-12: filen hade NOLL körningar någonsin trots korrekt
      # namnlänk, medan det här jobbet (led 3) körde varje natt. Ett steg i samma
      # jobb delar dessutom Neon-fönstret och checkout/npm-kostnaden.
      # ⛔ `!cancelled()`: svepet är OBEROENDE av synken — samma princip som
      # kedjans "ingen conclusion-grind". Ett synkfel får inte tyst svälja svepet.
      # `tests/unit/cron-chain-sync.test.ts` vaktar att steget finns kvar.
      - name: Tradera sålt-svep (hammarpriser till prisgrafen)
        if: steps.guard.outputs.ready == 'true' && !cancelled()
        env:
          TRADERA_SOLD_PAGES: "200"
          TRADERA_SOLD_LOOKBACK_DAYS: "3"
        run: npx tsx scripts/tradera-sold-sweep.ts
