name: Tradera-svep (dagligen)

# Hämtar Tradera-annonser via det officiella SOAP-API:t en gång per dygn.
# Tradera-kvoten är 10000 anrop/dygn PER metod (SearchAdvanced m.fl.) → vi namn-söker
# TRADERA_SEARCH_BUDGET produkter/dygn och roterar genom hela katalogen över ~en vecka.
# Körs i molnet — datorn behöver inte vara på.
# ── LÄNKAD TILL FÖREGÅENDE JOBB, INTE TILL KLOCKAN (2026-08-05) ──────────────
# Neons nota är VAKEN TID, och varje väckning köper minst 300 s debiterad tid. Fyra
# nattjobb på egen cron (02:00 / 04:00 / 05:00 / 05:30) väckte computen FYRA gånger,
# spritt över ~3 timmar — och eftersom GitHubs cron dessutom släpar 1,5–3,5 h låg de i
# praktiken ännu glesare. Kedjade i stället: ett sammanhängande fönster, en väckning.
# Mellanrummet (runner-kö + checkout + npm ci) är minuter, alltså långt under
# autosuspendens 300 s, så Neon hinner aldrig somna mitt i kedjan.
#
# ⛔ INGEN `conclusion`-grind. Jobben är OBEROENDE av varandra — de delar bara
#    tidsfönster. Gatade vi på `success` hade ett misslyckat Tradera-svep tyst dödat
#    de tre efterföljande jobben, dvs bytt en synlig röd körning mot tre osynligt
#    uteblivna. `types: [completed]` fyrar oavsett utfall.
# ⛔ `workflows:` MATCHAR PÅ `name:`-FÄLTET i det andra filen, inte på filnamnet.
#    Byter du namn på uppströmsjobbet bryts kedjan TYST och det här jobbet slutar
#    köras helt. Byt då namnet på båda ställena i samma commit.
on:
  workflow_run:
    workflows: ["Full insamling (dagligen)"]
    types: [completed]
  workflow_dispatch: {}

# Minsta möjliga rättighet. INGET jobb i det här repot skriver till GitHub — de läser
# koden och skriver till Neon. Utan blocket får GITHUB_TOKEN repots STANDARD-rättigheter,
# vilket kan vara skrivande, och en komprometterad beroendekedja hade då kunnat pusha.
# ⛔ Inkommande workflow_dispatch (restock-pingern) påverkas INTE: den auktoriseras av
# ANROPARENS token, inte av det här blocket.
permissions:
  contents: read

concurrency:
  group: tradera-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 80 # 60 → 80 (2026-11-13): One Piece-stegets bildkoll får 10 min ovanpå svepets ~50
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL: "10" # större Prisma-pool → mapPool-samtidighet utan pool_timeout
      TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
      TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
      # Ingen AI-nyckel: verify-matches är en REGELDOM sedan 2026-10-16 (src/jobs/verify-deals.ts).
      # Namn-sökningar/dygn (Fas 0, direkt-match → billigt). Parallellt + under
      # 10000/dygn-kvoten. Roterar genom hela katalogen (~21k) på ~4 dygn;
      # bevakade/populära produkter söks varje dygn.
      TRADERA_SEARCH_BUDGET: "5000"
    steps:
      # Self-healing-vakt: hoppa över grönt tills DATABASE_URL-secret finns
      # (molnhosting konfigurerad). Inga misslyckade-mejl innan dess.
      - name: Förkrav — DATABASE_URL måste vara satt
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice::DATABASE_URL saknas — hoppar över tills molnhosting (Neon) är konfigurerad. Förväntat = grön körning."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.guard.outputs.ready == 'true'
        run: npx prisma generate
      - if: steps.guard.outputs.ready == 'true'
        run: npx tsx scripts/tradera-full-sweep.ts

      # ONE PIECE (2026-11-13): hela Tradera-kategorin 1001268, ~140 sökanrop. TORRKÖRNING tills loggen
      # är läst (träffar + stickprov) — sätt repo-variabeln OP_TRADERA_APPLY=1 för att börja skriva.
      #
      # SPRÅKDOMEN PÅ FOTOT (2026-11-13): koden är densamma på japanska kort och kategorin saknar
      # språkattribut ⇒ en singel sätter pris bara när fotot bevisats vara det engelska kortet
      # (scripts/op-listing-language.py, OpenCV). Domarna sparas per annons-id i Actions-cachen —
      # nyckeln är unik per körning så cachen alltid sparas, och återställs på prefix. Sålt-svepet
      # (tradera-sold-sync.yml) läser samma cache. Budgeten håller steget kort: första nätterna
      # hinner inte alla ~2 400 foton, resten väntar (och sätter inget pris) till nästa natt.
      - if: steps.guard.outputs.ready == 'true' && !cancelled()
        name: Språkdomarnas cache (One Piece-foton)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .op-lang-cache
          key: op-lang-${{ github.run_id }}
          restore-keys: |
            op-lang-
      - if: steps.guard.outputs.ready == 'true' && !cancelled()
        name: OpenCV till bildkollen
        continue-on-error: true
        run: python3 -m pip install --quiet --disable-pip-version-check opencv-python-headless numpy
      - if: steps.guard.outputs.ready == 'true' && !cancelled()
        name: One Piece på Tradera
        continue-on-error: true
        env:
          OP_TRADERA_APPLY: ${{ vars.OP_TRADERA_APPLY }}
          OP_LANG_BUDGET_SECONDS: "600"
        run: npx tsx scripts/op-tradera-sweep.ts

      # Släng den cachade bilden av priserna — se cardmarket-refresh.yml för varför.
      - if: steps.guard.outputs.ready == 'true'
        name: Invalidera sid-cachen (annonserna är skrivna)
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::notice::CRON_SECRET saknas i repo-secrets — hoppar över cache-invalidering."
            exit 0
          fi
          url="${SITE_URL:-https://scoutr.se}/api/revalidate"
          code=$(curl -sS -o reval.json -w '%{http_code}' -X POST -H "x-cron-secret: ${CRON_SECRET}" "$url")
          echo "revalidate → HTTP $code $(cat reval.json)"
          test "$code" = "200"
