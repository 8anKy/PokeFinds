name: Discord-inbjudan (manuell)

# ENGÅNGSUTSKICK till befintliga konton: "kom och häng med oss på Discord".
#
# ⛔ VARFÖR ETT WORKFLOW OCH INTE EN LOKAL KÖRNING: `RESEND_API_KEY` finns bara i
# Railway och som Actions-secret. Lokalt står dessutom `EMAIL_MODE=console` i .env,
# och då LOGGAR mailern mejlet i stället för att skicka det — utan att fela. Ett
# provutskick 2026-08-14 rapporterade "✓ skickat" för en mottagare som aldrig fick
# något. Här finns nyckeln, och `EMAIL_FROM` faller tillbaka på kodens
# `Foilio <noreply@foilio.se>` i stället för den lokala .env:ens föråldrade
# pokefinds.se-avsändare.
#
# ⚠️ DEN FALLBACKEN VAR TRASIG till 2026-08-16: repo-variabeln `EMAIL_FROM` finns
# inte, `${{ vars.EMAIL_FROM }}` expanderar då till TOM STRÄNG, och mailern använde
# `??` som bara fångar undefined. Avsändaren blev tom ⇒ Resend `422 "The domain is
# invalid"`. Fixat med `||` i src/lib/mailer.ts. Sätt alltså INTE repo-variabeln för
# att "laga" det — koden äger avsändaren, och en variabel som pekar på pokefinds.se
# vore en tyst regression.
#
# ⛔ ALDRIG PÅ SCHEMA. Det här är ett engångsutskick; ett schemalagt sådant vore
# spam mot en lista där avanmälan är samma spak som bär pris- och restock-larmen.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Skicka på riktigt (av = torrkörning, listar bara mottagarna)"
        type: boolean
        default: false
      to:
        description: "Skicka BARA till denna adress (provutskick). Tomt = alla mottagare."
        type: string
        default: ""
      skip:
        description: "Kommaseparerade adresser att hoppa över (t.ex. den som redan fått provutskicket)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: discord-invite
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Förkrav — DATABASE_URL och RESEND_API_KEY måste vara satta
        id: guard
        run: |
          # Till skillnad från de schemalagda jobben är ett saknat förkrav här ett
          # FEL, inte en tyst no-op: någon har tryckt på knappen och väntar sig ett
          # utskick. En grön körning utan mejl är precis den lögn skriptets
          # konsollägesvakt finns för att förhindra.
          missing=""
          [ -z "${DATABASE_URL}" ] && missing="${missing} DATABASE_URL"
          [ -z "${RESEND_API_KEY}" ] && missing="${missing} RESEND_API_KEY"
          if [ -n "${missing}" ]; then
            echo "::error::Saknade secrets:${missing} — inget skickat."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - id: nm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npx prisma generate
      - name: Skicka inbjudan
        run: |
          args=""
          if [ "${{ inputs.apply }}" = "true" ]; then args="${args} --apply"; fi
          if [ -n "${{ inputs.to }}" ]; then args="${args} --to=${{ inputs.to }}"; fi
          if [ -n "${{ inputs.skip }}" ]; then args="${args} --skip=${{ inputs.skip }}"; fi
          echo "Kör: scripts/send-discord-invite.ts${args}"
          npx tsx scripts/send-discord-invite.ts ${args}
