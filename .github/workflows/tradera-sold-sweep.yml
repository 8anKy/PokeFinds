name: Tradera sålda auktioner (manuell/backfill)

# Hämtar AVSLUTADE Tradera-annonser och skriver bevisade försäljningar som
# prishistorik under källan "Tradera sålt" — en EGEN kurva i prisgrafen.
# Två bevisvägar: auktion med bud (MaxBid) och GetItem-verifierad Köp nu
# (GotWinner=true). Se src/jobs/tradera-sold-sweep.ts.
#
# ⛔ DEN DAGLIGA KÖRNINGEN LIGGER INTE HÄR. Den är ett STEG i tradera-sold-sync.yml.
#    Skälet är GitHubs kedjegräns: `workflow_run` fyrar högst TRE nivåer djupt från
#    roten, och nattkedjan scrape-all → tradera-sweep → cardtrader-refresh →
#    tradera-sold-sync är redan tre led. Den här filen låg först som ett FJÄRDE led
#    och fyrade därför ALDRIG — noll körningar någonsin, helt tyst, medan led 3
#    körde varje natt (upptäckt 2026-08-12). Lägg ALDRIG tillbaka en
#    workflow_run-trigger här; tests/unit/cron-chain-sync.test.ts vaktar det.
#
# Det här workflowet finns kvar för MANUELLA körningar/backfill med egna parametrar.
# ⚠️ API:t serverar bara ~200 sidor per fråga (sida 300 svarar tomt, mätt) — en
# lookback större än ~2-3 dygn i singel-kategorin når därför ändå inte längre bak.
#
# ⛔ Skriver ALDRIG en Offer — en såld annons går inte att köpa. Länkar och
#    karusellen kommer fortsatt från det aktiva svepet (tradera-sweep).
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Max sidor per kategori (50 träffar/sida)"
        default: "200"
        type: string
      lookback_days:
        description: "Hur många dygn bak pagineringen läser"
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: tradera-sold-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL: "10"
      TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
      TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
      TRADERA_SOLD_PAGES: ${{ inputs.pages }}
      TRADERA_SOLD_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
    steps:
      # Self-healing-vakt: hoppa över grönt tills DATABASE_URL-secret finns.
      - name: Förkrav — DATABASE_URL måste vara satt
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice::DATABASE_URL saknas — hoppar över tills Neon är konfigurerad."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.guard.outputs.ready == 'true'
        run: npx prisma generate
      - if: steps.guard.outputs.ready == 'true'
        run: npx tsx scripts/tradera-sold-sweep.ts
