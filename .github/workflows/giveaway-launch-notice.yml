name: Giveaway-utskick — push + mejl (manuellt)

# Push + mejl om giveawayn med lotter till alla som INTE anmält sig.
# Skriptet: scripts/send-giveaway-launch.ts. Mallen: giveawayLaunchEmail.
#
# ⛔ ALDRIG PÅ SCHEMA. `send_to_all: false` (standard) = förhandsgranskning till ägaren
#    (mejl + push till ägarens enheter). `true` = skarpt, går inte att ångra.
on:
  workflow_dispatch:
    inputs:
      send_to_all:
        description: "SKARPT till ALLA. Tomt/false = förhandsgranskning till ägaren."
        type: boolean
        default: false
      skip_push:
        description: "Hoppa över pushen (t.ex. vid komplettering av mejl)."
        type: boolean
        default: false
      skip_email:
        description: "Hoppa över mejlet."
        type: boolean
        default: false
      only:
        description: "Komplettera EN e-postadress (kräver send_to_all + skip_push)."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: giveaway-launch-notice
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      APNS_KEY: ${{ secrets.APNS_KEY }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      APNS_KEY_ID: 4Z9FD42DDR
      APNS_TEAM_ID: F2XP44FF3B
      APNS_BUNDLE_ID: se.foilio.app
      APNS_PRODUCTION: "true"
    steps:
      - name: Förkrav
        run: |
          missing=""
          [ -z "${DATABASE_URL}" ] && missing="${missing} DATABASE_URL"
          [ -z "${RESEND_API_KEY}" ] && missing="${missing} RESEND_API_KEY"
          if [ -z "${UNSUBSCRIBE_SECRET}" ] && [ -z "${NEXTAUTH_SECRET}" ]; then missing="${missing} UNSUBSCRIBE_SECRET/NEXTAUTH_SECRET"; fi
          [ -z "${APNS_KEY}" ] && missing="${missing} APNS_KEY"
          if [ -n "${missing}" ]; then echo "::error::Saknade hemligheter:${missing}"; exit 1; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - name: Skicka
        run: |
          args=""
          [ "${{ inputs.send_to_all }}" = "true" ] && args="$args --send-to-all"
          [ "${{ inputs.skip_push }}" = "true" ] && args="$args --skip-push"
          [ "${{ inputs.skip_email }}" = "true" ] && args="$args --skip-email"
          [ -n "${{ inputs.only }}" ] && args="$args --only=${{ inputs.only }}"
          npx tsx scripts/send-giveaway-launch.ts $args
