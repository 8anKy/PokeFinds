name: Auto-import nya set + singlar (veckovis)

# Importerar NYA set (CardSet + alla kort + SINGLE_CARD-produkter med bilder) från
# officiella Pokémon TCG API:t så fort de dyker upp där (~vid släpp). TCG_NEW_ONLY=1
# gör körningen till en snabb no-op när inget nytt finns (1 API-anrop + 1 DB-fråga).
# Priser/CM-länkar/graf fylls sedan av dagliga cardmarket-refresh (13:00 UTC) som
# upsertar offers på ALLA singlar med tcgExternalId — ingen manuell fill behövs.
# Körs 03:30, FÖRE sealed-importen (04:00), så ett nytt sets CardSet finns när
# sealed-importen sätter set-etiketter (setId) på nya sealed-produkter.
on:
  schedule:
    - cron: "30 3 * * 0" # söndagar 03:30 UTC
  workflow_dispatch: {}

# Minsta möjliga rättighet. INGET jobb i det här repot skriver till GitHub — de läser
# koden och skriver till Neon. Utan blocket får GITHUB_TOKEN repots STANDARD-rättigheter,
# vilket kan vara skrivande, och en komprometterad beroendekedja hade då kunnat pusha.
# ⛔ Inkommande workflow_dispatch (restock-pingern) påverkas INTE: den auktoriseras av
# ANROPARENS token, inte av det här blocket.
permissions:
  contents: read

concurrency:
  group: import-new-sets
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }} # valfri — högre rate limit
      EUR_SEK: ${{ secrets.EUR_SEK }}
      TCG_NEW_ONLY: "1"
      # Bildlagningen nedan behöver dem. CardTrader är gratis; RapidAPI-kostnaden
      # är ~10 anrop av 3000/dygn (episodlista + de set som faktiskt har en lucka).
      CARDMARKET_RAPIDAPI_HOST: ${{ secrets.CARDMARKET_RAPIDAPI_HOST }}
      CARDMARKET_RAPIDAPI_KEY: ${{ secrets.CARDMARKET_RAPIDAPI_KEY }}
      CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
    steps:
      - name: Förkrav — DATABASE_URL måste vara satt
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice::DATABASE_URL saknas — hoppar över tills molnhosting är konfigurerad."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.guard.outputs.ready == 'true'
        run: npx prisma generate
      - if: steps.guard.outputs.ready == 'true'
        name: Importera nya set (no-op om inget nytt)
        run: npx tsx scripts/import-tcg-data.ts

      # NÄMNARNA för set-komplettering: `totalCardsFull` (pokemontcg.io `total`,
      # hela setet inkl. secret rares) och `printingsTotal` (TCGdex, master
      # set-nämnaren). Måste ligga som ett EGET steg, inte bara i upserten ovan:
      # jobbet kör med TCG_NEW_ONLY=1, så importens `update`-gren rör ALDRIG
      # befintliga set — en kolumn som bara fylls där hade fyllts för nya set och
      # för ingen annan, för alltid. Steget är en billig no-op när inget ändrats.
      # ⛔ Lägg inga fler LED i nattkedjan — det här jobbet har egen cron och
      # ingen workflow_run, så ett STEG här är lagligt.
      #
      # ⛔ `!cancelled()` KRÄVS PÅ STEGEN HÄRIFRÅN OCH NEDÅT. Ett `if:` utan
      # statusfunktion får implicit `success()`, så ETT rött steg svälter allt
      # efter det — tyst. MÄTT 2026-08-23: `/v2/sets` hos pokemontcg.io svarade
      # 500 och nämnarsteget dog, varpå BÅDE bildlagningen och avtrycksbygget
      # hoppades över (`skipped` i körning 32617045678). De två stegen har
      # ingenting med nämnarna att göra, och priset för att missa dem är att
      # kort blir OSYNLIGA för skannerns bildmatchning — se kommentarerna nedan.
      # Samma fälla, samma lagning som i store-health.yml. Jobbet blir ändå rött
      # av det fallerade steget, så larmet består.
      - if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        name: Fyll set-nämnarna (pokemontcg.io total + TCGdex-tryckningar)
        run: npx tsx scripts/import-set-denominators.ts

      # DÖDA BILDLÄNKAR — hotlinkar vi inte äger ruttnar, och en död bild är inte
      # ett skönhetsfel: `Card.artFingerprint` byggs UR bilden, så kortet blir
      # osynligt för skannerns bildmatchning. MÄTT 2026-08-03: TCGGO roterade sina
      # storage-id:n och slog ut alla 82 MEP-kort på en gång (34134 → 36834), utan
      # att något felade. Steget måste ligga FÖRE avtryckssteget så nya kort som
      # kom in med en trasig bild ändå får ett avtryck samma körning.
      # Verifierar varje URL innan den skrivs → fungerande bilder rörs aldrig.
      - if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        name: Laga döda kortbilder (verifierar, rör aldrig en fungerande bild)
        env:
          APPLY: "1"
        run: npx tsx scripts/fix-card-images.ts

      # KONSTAVTRYCK för de nya korten — annars är de OSYNLIGA för skannerns
      # bildmatchning, tyst. `Card.numberSortKey` räknas av Postgres (GENERATED)
      # just för att ingen import ska kunna glömma den; ett avtryck kräver
      # bildavkodning och kan därför inte genereras i databasen, så det MÅSTE
      # köras här. Steget rör bara kort som saknar avtryck → billig no-op när
      # inga nya set kom. Se src/lib/art-fingerprint.ts.
      - if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        name: Bygg konstavtryck för nya kort (no-op om inga saknas)
        run: npx tsx scripts/build-art-fingerprints.ts
