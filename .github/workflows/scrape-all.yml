name: Full insamling (dagligen)

# Ett komplett insamlingspass: alla aktiva butiks-skrapor + CM-prisguide +
# priscache-omräkning + alert-utskick. Dagligen (inte var 8:e h som lokalt) för
# att inte krocka med Tradera-svepets dygnskvot. Ser du Tradera-kvotvarningar:
# avaktivera detta jobb eller Tradera-källan så bara tradera-sweep.yml når Tradera.
# ⛔ KEDJANS FÖRSTA LÄNK — `name:` OVAN FÅR INTE ÄNDRAS UTAN FÖLJDÄNDRING.
# tradera-sweep.yml lyssnar på `workflow_run` mot exakt strängen "Full insamling
# (dagligen)", och den i sin tur startar cardtrader-refresh → tradera-sold-sync.
# Byter du namn här slutar TRE jobb köra, tyst och utan felmeddelande. Skälet till
# kedjan står i tradera-sweep.yml: Neon debiteras per VAKEN TID, inte per fråga.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC dagligen — enda klockstyrda starten i nattkedjan
  workflow_dispatch: {}

# Minsta möjliga rättighet. INGET jobb i det här repot skriver till GitHub — de läser
# koden och skriver till Neon. Utan blocket får GITHUB_TOKEN repots STANDARD-rättigheter,
# vilket kan vara skrivande, och en komprometterad beroendekedja hade då kunnat pusha.
# ⛔ Inkommande workflow_dispatch (restock-pingern) påverkas INTE: den auktoriseras av
# ANROPARENS token, inte av det här blocket.
permissions:
  contents: read

concurrency:
  group: scrape-all
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Full insamling (alla källor). Körtid 20–38 min och växer med katalogen →
    # 50 var i underkant. Daglig cron → ingen krock. Publikt repo = gratis minuter.
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL: "10" # större Prisma-pool → mapPool-samtidighet utan pool_timeout
      # Auto-importens gränsfalls-dom (Haiku, ören/dygn) — attach istället för dubblettstub.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }} # utan denna mailas inga alerts (mailer går i console-mode)
      # ⛔ RESTOCK-LARMEN ÄR PAUSADE (ägarbeslut 2026-08-23). Att stänga av restock-watch.yml
      # räckte INTE: den fulla insamlingen nedan diffar också lagerstatus och anropar samma
      # checkRestockAlerts — larmen fortsatte alltså gå ut en gång per natt (8 mejl 2026-08-25)
      # medan pause-mejlet sa till användarna att de låg nere. Raden är den enda spaken som
      # behövs här; koden defaultar också till pausat (src/lib/restock-alerts-pause.ts).
      # SÄTT TILL "0" NÄR LARMEN SKA PÅ IGEN — och slå på restock-watch.yml samtidigt.
      # ⛔ Veckobrevet och RestockEvent-historiken berörs INTE.
      RESTOCK_ALERTS_PAUSED: "1"
      # ⛔ PRISLARMEN ÄR OCKSÅ PAUSADE (ägarbeslut 2026-08-26) — men av HELT ANDRA SKÄL,
      # därför en egen spak. Restock väntar på kostnad; prislarmen väntar på en LAGNING:
      # de larmar på offers som varken är i lager eller direktlänkade (ett mätt falskt larm
      # 2026-08-26: "nu 1 338 kr" på en produkt vars lägsta pris var 2 665 kr), de saknar
      # cooldown helt (samma produkt larmade 7 ggr på 30 dygn), och mejlet visar ett annat
      # pris än det som utlöste larmet. Nattkedjan här är den ENDA vägen som anropar
      # checkPriceAlerts. Se src/lib/price-alerts-pause.ts innan du sätter "0".
      PRICE_ALERTS_PAUSED: "1"
      # APNs (iOS push). Utan APNS_KEY blir sendPush en no-op → bara mejl, ingen pushnotis.
      # ⛔ VID NYCKELROTATION: uppdatera BÅDE GH-secreten APNS_KEY *och* APNS_KEY_ID i
      # ALLA tre workflow-filer — Railway är en HELT egen uppsättning variabler.
      APNS_KEY: ${{ secrets.APNS_KEY }}
      APNS_KEY_ID: 783RWWQFH7
      APNS_TEAM_ID: F2XP44FF3B
      APNS_BUNDLE_ID: se.foilio.app
      APNS_PRODUCTION: "true"
      TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
      TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
      CARDMARKET_RAPIDAPI_HOST: ${{ secrets.CARDMARKET_RAPIDAPI_HOST }}
      CARDMARKET_RAPIDAPI_KEY: ${{ secrets.CARDMARKET_RAPIDAPI_KEY }}
    steps:
      # Self-healing-vakt: hoppa över grönt tills DATABASE_URL-secret finns
      # (molnhosting konfigurerad). Inga misslyckade-mejl innan dess.
      - name: Förkrav — DATABASE_URL måste vara satt
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice::DATABASE_URL saknas — hoppar över tills molnhosting (Neon) är konfigurerad. Förväntat = grön körning."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.guard.outputs.ready == 'true'
        run: npx prisma generate
      - if: steps.guard.outputs.ready == 'true'
        run: npx tsx scripts/scrape-all-run.ts
      # GTIN: hämta tillverkarens streckkod för offers som ännu saknar den (5 av 7
      # butiker publicerar den — mätt 73% täckning). En extra HTTP-request per NY
      # offer, aldrig i restock-lanen. Streckkoden gör matchningen exakt i stället för
      # ungefärlig och gör felaktiga butikslänkar upptäckbara med ren SQL.
      # --limit håller körtiden i schack; resten tas nästa dygn (skriptet är resumerbart).
      - if: steps.guard.outputs.ready == 'true'
        run: npx tsx scripts/backfill-gtin.ts --limit 400

      # Ruttabell + källista åt Discord-snabbfilen (discord-restock.yml), som är DB-FRI
      # och därför inte kan slå upp "vilken produkt är den här butiks-URL:en?" själv.
      # ⛔ Ligger HÄR med flit: Neon är redan vaken i det här fönstret. En egen cron
      # hade varit ytterligare en väckning à minst 300 s — och då vore snabbfilen inte
      # längre gratis, vilket är hela dess existensberättigande.
      # continue-on-error: en missad export gör bara att snabbfilen hoppar över tills
      # nästa natt; den får ALDRIG fälla nattkedjan.
      - if: steps.guard.outputs.ready == 'true'
        name: Exportera ruttabell åt Discord-snabbfilen
        id: routes
        continue-on-error: true
        run: npx tsx scripts/export-restock-routes.ts
      - if: steps.guard.outputs.ready == 'true' && steps.routes.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .restock-routes
          key: restock-routes-${{ github.run_id }}

      # Discord-rollavstämning. Ligger HÄR i stället för i en egen cron med flit:
      # Neon debiteras per vaken tid, och databasen är redan vaken i det här
      # fönstret — en egen nattlig start hade varit ytterligare en väckning à
      # minst 300 s för ett jobb som tar sekunder.
      # ⛔ Varför den behövs alls: `bonusProUntil`/`stripeProUntil` LÖPER UT utan
      # att någon webhook fyras, så utan den här körningen sitter Pro-rollen kvar
      # i all evighet hos den som slutat betala. Se src/jobs/discord-reconcile.ts.
      # continue-on-error: Discord är inte kritiskt för insamlingen, och ett
      # avbrott här hade stoppat cache-invalideringen nedan.
      - if: steps.guard.outputs.ready == 'true'
        name: Stäm av Discord-roller mot vem som har Pro
        continue-on-error: true
        env:
          DISCORD_ENABLED: ${{ vars.DISCORD_ENABLED }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_ROLE_VERIFIED: ${{ secrets.DISCORD_ROLE_VERIFIED }}
          DISCORD_ROLE_PRO: ${{ secrets.DISCORD_ROLE_PRO }}
          # ⛔ CLIENT_ID/CLIENT_SECRET skickas medvetet INTE hit. Jobbet gör aldrig
          # ett OAuth-utbyte — bara rollanrop med bot-token — och `discordBotConfig()`
          # är skild från OAuth-halvan just för att den här filen inte ska behöva
          # en hemlighet den aldrig använder. Färre kopior = färre ställen att
          # glömma vid rotation (jfr APNs-nyckeln, som lever i tre filer).
        run: npx tsx scripts/discord-reconcile-run.ts

      # Varna dem vars GRATIS Pro-period tar slut om några dagar. Ligger här av
      # samma skäl som avstämningen ovan: Neon är redan vaken i det här fönstret.
      # ⛔ Varför den är obligatorisk: restock-larm är Pro-only, så en utgången
      # gratisperiod tystar larmen UTAN ett ord — och användaren drar slutsatsen att
      # appen är trasig, inte att provperioden tog slut. Se src/jobs/pro-expiry-notice.ts.
      - if: steps.guard.outputs.ready == 'true'
        name: Varna om utgående gratis Pro-perioder
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: npx tsx scripts/pro-expiry-notice-run.ts

      # VECKOBREVET till alla konton. Ligger som STEG här av samma skäl som stegen
      # ovan: Neon är redan vaken i det här fönstret, och nattkedjan får max tre led
      # (ett fjärde workflow_run-led fyrar ALDRIG, tyst). ⛔ Ingen egen cron —
      # jobbet avgör SJÄLV om det är rätt veckodag (UTC, WEEKLY_DIGEST_WEEKDAY,
      # default måndag) och `weeklyDigestSentAt` spärrar dubbletter vid omkörning.
      # ⛔ NEXTAUTH_SECRET behövs för att SIGNERA avregistreringslänkarna, och måste
      # vara EXAKT samma värde som appen i Railway verifierar med — annars är varje
      # avanmälan i utskicket död. Saknas den vägrar jobbet skicka (röd, men noll mejl).
      # continue-on-error: ett brev som uteblir får aldrig fälla insamlingen.
      - if: steps.guard.outputs.ready == 'true'
        name: Skicka veckobrevet (bara på rätt veckodag)
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Bulk-lanen (300/dygn). Saknas den går brevet på Resend (100/dygn).
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          WEEKLY_DIGEST_WEEKDAY: ${{ vars.WEEKLY_DIGEST_WEEKDAY }}
        run: npx tsx scripts/weekly-digest-run.ts

      # UTMÄRKELSER: dela ut nya märken till alla konton. Ligger som STEG här av
      # samma skäl som stegen ovan: Neon är redan vaken i det här fönstret, och
      # nattkedjan får max tre led (ett fjärde workflow_run-led fyrar ALDRIG, tyst).
      # ⛔ Ingen egen cron — en separat start hade varit ytterligare en väckning à
      # minst 300 s för ett jobb som är fem SQL-satser och tar sekunder.
      # ⛔ Jobbet är rent set-baserat (aggregat över hela basen, aldrig en fråga per
      # användare) och idempotent: @@unique([userId, key, tier]) + skipDuplicates
      # gör en omkörning till noll skrivningar. Se src/jobs/achievement-sweep.ts.
      # continue-on-error: ett uteblivet märke får aldrig fälla insamlingen.
      - if: steps.guard.outputs.ready == 'true'
        name: Dela ut utmärkelser
        continue-on-error: true
        run: npx tsx scripts/achievement-sweep-run.ts

      # Gallra väntrummet för påbörjade registreringar. Raden raderas annars BARA
      # när registreringen lyckas, så varje avbruten, utgången eller studsad
      # registrering lämnar en e-postadress i tabellen för alltid — personuppgifter
      # utan syfte och utan gallringstid. Ligger som STEG här (aldrig egen cron):
      # Neon debiteras per VAKEN TID och är redan vaken i det här fönstret.
      # ⛔ Skriptet skriver ut fördelningen INNAN det raderar. Raderna är det enda
      # spår som finns av misslyckade registreringar, så loggen är kvar även när
      # raderna är borta. Se src/lib/signup-verification-audit.ts.
      - if: steps.guard.outputs.ready == 'true'
        name: Gallra utgångna registreringskoder
        continue-on-error: true
        run: npx tsx scripts/signup-verification-report.ts --apply

      # Släng den cachade bilden av priserna — se cardmarket-refresh.yml för varför.
      - if: steps.guard.outputs.ready == 'true'
        name: Invalidera sid-cachen (priserna är skrivna)
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::notice::CRON_SECRET saknas i repo-secrets — hoppar över cache-invalidering."
            exit 0
          fi
          url="${SITE_URL:-https://foilio.se}/api/revalidate"
          code=$(curl -sS -o reval.json -w '%{http_code}' -X POST -H "x-cron-secret: ${CRON_SECRET}" "$url")
          echo "revalidate → HTTP $code $(cat reval.json)"
          test "$code" = "200"
