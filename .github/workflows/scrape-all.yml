name: Full insamling (dagligen)

# Ett komplett insamlingspass: alla aktiva butiks-skrapor + CM-prisguide +
# priscache-omräkning + alert-utskick. Dagligen (inte var 8:e h som lokalt) för
# att inte krocka med Tradera-svepets dygnskvot. Ser du Tradera-kvotvarningar:
# avaktivera detta jobb eller Tradera-källan så bara tradera-sweep.yml når Tradera.
# ⛔ KEDJANS FÖRSTA LÄNK — `name:` OVAN FÅR INTE ÄNDRAS UTAN FÖLJDÄNDRING.
# tradera-sweep.yml lyssnar på `workflow_run` mot exakt strängen "Full insamling
# (dagligen)", och den i sin tur startar cardtrader-refresh → tradera-sold-sync.
# Byter du namn här slutar TRE jobb köra, tyst och utan felmeddelande. Skälet till
# kedjan står i tradera-sweep.yml: Neon debiteras per VAKEN TID, inte per fråga.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC dagligen — enda klockstyrda starten i nattkedjan
  workflow_dispatch: {}

# Minsta möjliga rättighet. INGET jobb i det här repot skriver till GitHub — de läser
# koden och skriver till Neon. Utan blocket får GITHUB_TOKEN repots STANDARD-rättigheter,
# vilket kan vara skrivande, och en komprometterad beroendekedja hade då kunnat pusha.
# ⛔ Inkommande workflow_dispatch (restock-pingern) påverkas INTE: den auktoriseras av
# ANROPARENS token, inte av det här blocket.
permissions:
  contents: read

concurrency:
  group: scrape-all
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Full insamling (alla källor). Körtid 20–38 min och växer med katalogen →
    # 50 var i underkant. Daglig cron → ingen krock. Publikt repo = gratis minuter.
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL: "10" # större Prisma-pool → mapPool-samtidighet utan pool_timeout
      # Auto-importens gränsfalls-dom (Haiku, ören/dygn) — attach istället för dubblettstub.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }} # utan denna mailas inga alerts (mailer går i console-mode)
      # APNs (iOS push). Utan APNS_KEY blir sendPush en no-op → bara mejl, ingen pushnotis.
      APNS_KEY: ${{ secrets.APNS_KEY }}
      APNS_KEY_ID: SMQBU7MM82
      APNS_TEAM_ID: F2XP44FF3B
      APNS_BUNDLE_ID: se.foilio.app
      APNS_PRODUCTION: "true"
      TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
      TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
      CARDMARKET_RAPIDAPI_HOST: ${{ secrets.CARDMARKET_RAPIDAPI_HOST }}
      CARDMARKET_RAPIDAPI_KEY: ${{ secrets.CARDMARKET_RAPIDAPI_KEY }}
    steps:
      # Self-healing-vakt: hoppa över grönt tills DATABASE_URL-secret finns
      # (molnhosting konfigurerad). Inga misslyckade-mejl innan dess.
      - name: Förkrav — DATABASE_URL måste vara satt
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice::DATABASE_URL saknas — hoppar över tills molnhosting (Neon) är konfigurerad. Förväntat = grön körning."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.guard.outputs.ready == 'true'
        run: npx prisma generate
      - if: steps.guard.outputs.ready == 'true'
        run: npx tsx scripts/scrape-all-run.ts
      # GTIN: hämta tillverkarens streckkod för offers som ännu saknar den (5 av 7
      # butiker publicerar den — mätt 73% täckning). En extra HTTP-request per NY
      # offer, aldrig i restock-lanen. Streckkoden gör matchningen exakt i stället för
      # ungefärlig och gör felaktiga butikslänkar upptäckbara med ren SQL.
      # --limit håller körtiden i schack; resten tas nästa dygn (skriptet är resumerbart).
      - if: steps.guard.outputs.ready == 'true'
        run: npx tsx scripts/backfill-gtin.ts --limit 400

      # Släng den cachade bilden av priserna — se cardmarket-refresh.yml för varför.
      - if: steps.guard.outputs.ready == 'true'
        name: Invalidera sid-cachen (priserna är skrivna)
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::notice::CRON_SECRET saknas i repo-secrets — hoppar över cache-invalidering."
            exit 0
          fi
          url="${SITE_URL:-https://www.foilio.se}/api/revalidate"
          code=$(curl -sS -o reval.json -w '%{http_code}' -X POST -H "x-cron-secret: ${CRON_SECRET}" "$url")
          echo "revalidate → HTTP $code $(cat reval.json)"
          test "$code" = "200"
