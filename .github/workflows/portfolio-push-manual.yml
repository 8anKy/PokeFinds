name: Veckopush om samlingen (manuell provnotis)

# PROVNOTIS av veckopushen (src/jobs/portfolio-push.ts) till EN användare. Det
# schemalagda utskicket är ett steg i scrape-all.yml (söndagar).
#
# ⛔ VARFÖR ETT WORKFLOW: APNs-nyckeln finns bara som Actions-secret / i Railway,
# inte i utvecklingsmaskinens .env — lokalt kan bara --dry-run köras.
# ⛔ `user_id` är OBLIGATORISK: det här workflowet kan aldrig skicka till alla.
# En provnotis rör inte veckomarkören — söndagens ordinarie utskick går som vanligt.
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "User.id som ska få provnotisen (obligatorisk)"
        type: string
        required: true
      dry_run:
        description: "Torrkörning (räkna, skicka inget)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portfolio-push-manual
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APNS_KEY: ${{ secrets.APNS_KEY }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      APNS_KEY_ID: 783RWWQFH7
      APNS_TEAM_ID: F2XP44FF3B
      APNS_BUNDLE_ID: se.foilio.app
      APNS_PRODUCTION: "true"
    steps:
      - name: Förkrav
        run: |
          if [ -z "${{ inputs.user_id }}" ]; then echo "::error::user_id saknas."; exit 1; fi
          if [ -z "${DATABASE_URL}" ]; then echo "::error::DATABASE_URL saknas."; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - id: nm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npx prisma generate
      - name: Skicka provnotisen
        env:
          USER_ID: ${{ inputs.user_id }}
          DRY: ${{ inputs.dry_run }}
        run: |
          args="--force --user=${USER_ID}"
          if [ "${DRY}" = "true" ]; then args="${args} --dry-run"; fi
          npx tsx scripts/portfolio-push-run.ts ${args}
