name: CardTrader-varianter (dagligen)

# Reverse holo, Master Ball / Poké Ball och 1st Edition prissätts av CardTraders
# marknadsplats — den enda källa vi har som prissätter PER TRYCKNING (flaggan
# sitter på annonsen, inte på produkten). Utan det här jobbet står de priserna
# still: importerna kördes manuellt när de byggdes, och prishistoriken byggs
# FRAMÅT, så en produkt utan daglig punkt får aldrig någon graf.
#
# Körs 05:00 UTC, långt från cardmarket-refresh (13:00) och hot-card (21:00) —
# de delar databas och skulle annars slåss om samma anslutningar.
#
# Kostar INGEN RapidAPI-kvot: CardTrader har en egen token och egna endpoints.
# Skripten är idempotenta (upsert per produkt+retailer) och skapar bara nya
# produkter när marknaden fått djup nog — en körning utan nyheter är en ren
# prisuppdatering.
# ── LÄNKAD TILL FÖREGÅENDE JOBB, INTE TILL KLOCKAN (2026-08-05) ──────────────
# Neons nota är VAKEN TID, och varje väckning köper minst 300 s debiterad tid. Fyra
# nattjobb på egen cron (02:00 / 04:00 / 05:00 / 05:30) väckte computen FYRA gånger,
# spritt över ~3 timmar — och eftersom GitHubs cron dessutom släpar 1,5–3,5 h låg de i
# praktiken ännu glesare. Kedjade i stället: ett sammanhängande fönster, en väckning.
# Mellanrummet (runner-kö + checkout + npm ci) är minuter, alltså långt under
# autosuspendens 300 s, så Neon hinner aldrig somna mitt i kedjan.
#
# ⛔ INGEN `conclusion`-grind. Jobben är OBEROENDE av varandra — de delar bara
#    tidsfönster. Gatade vi på `success` hade ett misslyckat Tradera-svep tyst dödat
#    de tre efterföljande jobben, dvs bytt en synlig röd körning mot tre osynligt
#    uteblivna. `types: [completed]` fyrar oavsett utfall.
# ⛔ `workflows:` MATCHAR PÅ `name:`-FÄLTET i det andra filen, inte på filnamnet.
#    Byter du namn på uppströmsjobbet bryts kedjan TYST och det här jobbet slutar
#    köras helt. Byt då namnet på båda ställena i samma commit.
on:
  workflow_run:
    workflows: ["Tradera-svep (dagligen)"]
    types: [completed]
  workflow_dispatch: {}

# Minsta möjliga rättighet. INGET jobb i det här repot skriver till GitHub — de läser
# koden och skriver till Neon. Utan blocket får GITHUB_TOKEN repots STANDARD-rättigheter,
# vilket kan vara skrivande, och en komprometterad beroendekedja hade då kunnat pusha.
# ⛔ Inkommande workflow_dispatch (restock-pingern) påverkas INTE: den auktoriseras av
# ANROPARENS token, inte av det här blocket.
permissions:
  contents: read

concurrency:
  group: cardtrader-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
      EUR_SEK: ${{ secrets.EUR_SEK }}
      APPLY: "1"
    steps:
      - name: Förkrav — DATABASE_URL och CARDTRADER_TOKEN måste vara satta
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ] || [ -z "${CARDTRADER_TOKEN}" ]; then
            echo "::notice::DATABASE_URL eller CARDTRADER_TOKEN saknas — hoppar över."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.guard.outputs.ready == 'true'
        run: npx prisma generate

      # Ordningen är den billigaste först: bollarna och 1st Edition rör ett
      # tiotal expansioner var, reverse-passet går igenom hela katalogen (~10 min).
      - if: steps.guard.outputs.ready == 'true'
        name: Master Ball / Poké Ball reverse holo
        run: npx tsx scripts/import-cardtrader-ball-reverse.ts

      - if: steps.guard.outputs.ready == 'true'
        name: 1st Edition (WOTC-seten)
        run: npx tsx scripts/import-cardtrader-first-edition.ts

      - if: steps.guard.outputs.ready == 'true'
        name: Reverse holo (hela katalogen)
        run: npx tsx scripts/import-cardtrader-reverse.ts
