name: Hot-card-priser (2×/dygn)

# Uppdaterar From-priset för de mest bevakade/visade korten en gång per kväll
# (utöver den dagliga fulla refreshen 13:00) → intradags-färska priser på korten
# folk tittar på. ~HOT_CARD_LIMIT anrop/körning → ryms i RapidAPI-kvotens slack.
# OBS: kör KVÄLL (21:00), EJ runt 13:00 — då äger den fulla refreshen den färska kvoten.
on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC (efter full refresh 13:00, samma kvotfönster)
  workflow_dispatch: {} # manuell "Run workflow"-knapp

# Minsta möjliga rättighet. INGET jobb i det här repot skriver till GitHub — de läser
# koden och skriver till Neon. Utan blocket får GITHUB_TOKEN repots STANDARD-rättigheter,
# vilket kan vara skrivande, och en komprometterad beroendekedja hade då kunnat pusha.
# ⛔ Inkommande workflow_dispatch (restock-pingern) påverkas INTE: den auktoriseras av
# ANROPARENS token, inte av det här blocket.
permissions:
  contents: read

concurrency:
  group: hot-card-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL: "10"
      CARDMARKET_RAPIDAPI_HOST: ${{ secrets.CARDMARKET_RAPIDAPI_HOST }}
      CARDMARKET_RAPIDAPI_KEY: ${{ secrets.CARDMARKET_RAPIDAPI_KEY }}
      EUR_SEK: ${{ secrets.EUR_SEK }}
      HOT_CARD_LIMIT: "400" # ~400 anrop/körning × 2 = 800/dygn (full refresh ~1100)
    steps:
      # Self-healing-vakt: hoppa över grönt tills DATABASE_URL-secret finns.
      - name: Förkrav — DATABASE_URL måste vara satt
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice::DATABASE_URL saknas — hoppar över tills molnhosting (Neon) är konfigurerad. Förväntat = grön körning."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.guard.outputs.ready == 'true'
        run: npx prisma generate
      - if: steps.guard.outputs.ready == 'true'
        run: npx tsx scripts/hot-card-refresh-run.ts
