name: Cardmarket-priser (dagligen)

# Uppdaterar singel- + sealed-priser från CardMarket API TCG (RapidAPI) en gång
# per dygn. Körs i molnet via GitHub Actions — kräver INTE att datorn är på.
on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC — direkt efter RapidAPI-kvotens dagsreset (12:59 UTC) så fulla refreshen får färsk kvot först
  workflow_dispatch: {} # manuell "Run workflow"-knapp

# Minsta möjliga rättighet. INGET jobb i det här repot skriver till GitHub — de läser
# koden och skriver till Neon. Utan blocket får GITHUB_TOKEN repots STANDARD-rättigheter,
# vilket kan vara skrivande, och en komprometterad beroendekedja hade då kunnat pusha.
# ⛔ Inkommande workflow_dispatch (restock-pingern) påverkas INTE: den auktoriseras av
# ANROPARENS token, inte av det här blocket.
permissions:
  contents: read

concurrency:
  group: cardmarket-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Skriver dagens pris + historik (singlar + sealed). Körtid 23–46 min (+ upp till
    # 60 min avtryckssteget sist, bara dagar då nya kort kom) och en
    # körning dödades vid 50m → för snävt; en timeout mitt i = partiell historik.
    # Daglig cron (24h mellan körningar) → ingen krock. Publikt repo = gratis minuter.
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_POOL: "10" # större Prisma-pool → mapPool-samtidighet utan pool_timeout
      CARDMARKET_RAPIDAPI_HOST: ${{ secrets.CARDMARKET_RAPIDAPI_HOST }}
      CARDMARKET_RAPIDAPI_KEY: ${{ secrets.CARDMARKET_RAPIDAPI_KEY }}
      EUR_SEK: ${{ secrets.EUR_SEK }}
      # JP-sealed-auto-mappningens LLM-dom (Haiku, ören/dygn). Utan nyckel mappas
      # bara nära-exakta namn (≥0.9) — refresh av redan mappade JP funkar ändå.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Variant-prissättningen (56 specialvarianter) läser pokemontcg.io. KEYLESS-nivån
      # (1000/dygn, 30/min) RÄCKER för vår lilla volym; kretsbrytaren hoppar resten om
      # 429 slår till. En GRATIS 20k-nyckel finns i praktiken inte längre: pokemontcg.io v2
      # sunsettar in i betalda Scrydex (billigast ~$29/mån ≈ 160 req/dygn — SÄMRE än keyless
      # för oss). Lägg alltså inte pengar på detta för 56 kort. Passthrough behålls ofarlig
      # (tom secret = keyless; en ev. gammal nyckel funkar automatiskt).
      POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
    steps:
      # Self-healing-vakt: hoppa över grönt tills DATABASE_URL-secret finns
      # (molnhosting konfigurerad). Inga misslyckade-mejl innan dess.
      - name: Förkrav — DATABASE_URL måste vara satt
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice::DATABASE_URL saknas — hoppar över tills molnhosting (Neon) är konfigurerad. Förväntat = grön körning."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - if: steps.guard.outputs.ready == 'true'
        run: npm ci --legacy-peer-deps
      - if: steps.guard.outputs.ready == 'true'
        run: npx prisma generate
      - if: steps.guard.outputs.ready == 'true'
        name: Priser + historik (RapidAPI)
        run: npx tsx scripts/cardmarket-refresh-run.ts

      # ── SLÄNG DEN CACHADE BILDEN AV PRISERNA ─────────────────────────────────
      # Publika sidor är ISR-cachade 1h OCH läser genom cachedRead. Utan det här
      # steget visar första besökaren efter varje jobb gårdagens graf (Next serverar
      # den gamla sidan medan den nya renderas i bakgrunden) — symtomet "bara några
      # kort har dagens datum". Att sänka TTL:en i stället var precis det som höll
      # Neon vaken; invalidering kostar bara en extra rendering per BESÖKT sida.
      # Saknas hemligheten: tyst no-op. En missad invalidering är kosmetisk (sidan
      # läker inom en timme), en röd körning på ett skrivet dygn är det inte.
      - if: steps.guard.outputs.ready == 'true'
        name: Invalidera sid-cachen (priserna är skrivna)
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::notice::CRON_SECRET saknas i repo-secrets — hoppar över cache-invalidering (sidorna läker via TTL inom 1h)."
            exit 0
          fi
          url="${SITE_URL:-https://foilio.se}/api/revalidate"
          code=$(curl -sS -o reval.json -w '%{http_code}' -X POST -H "x-cron-secret: ${CRON_SECRET}" "$url")
          echo "revalidate → HTTP $code $(cat reval.json)"
          test "$code" = "200"

      # Städar den prishistorik som spärrhake-buggen skrev (se cardmarket-refresh.ts).
      # MÅSTE ligga EFTER refreshen: skriptets facit är produktens EGET rättade pris, och
      # det finns inte förrän refreshen skrivit det. Skriptet har en egen vakt och AVBRYTER
      # om det ser att fixen inte kört (>20 priser kvar >10x från CM:s trend) — så den här
      # ordningen är inte bara konvention, den är påtvingad.
      #
      # Idempotent: när historiken är städad hittar den 0 rader och gör ingenting. Den kan
      # alltså ligga kvar i den dagliga körningen som ett skyddsnät — skulle ett skräpvärde
      # någonsin ta sig in igen städas det bort dagen därpå i stället för att ligga kvar i
      # movers-listan i en vecka.
      #
      # continue-on-error: historikstädningen får ALDRIG rödmarkera en körning som redan
      # skrivit dagens priser. En misslyckad städning är kosmetisk; en förlorad prisdag är inte.
      #
      # ── TORRKÖRNING TILLS VIDARE — INGET --apply ─────────────────────────────
      # Steget RADERAR INGENTING. Det loggar bara vad det SKULLE radera.
      #
      # Varför: städningens bärande vakt är PLATÅ-KRAVET (bara stillastående fel raderas,
      # äkta kurvor skonas). Den vakten har ALDRIG körts mot KORREKT data — RapidAPI-kvoten
      # tog slut 2026-07-14 innan refreshen hann läka något, så varje torrkörning dittills
      # jämförde mot FRUSNA priser och gav ett inverterat, meningslöst facit.
      # Att låta ett oprövat raderingsvillkor köra obevakat mot prod varje dygn är inte värt
      # den dag det sparar.
      #
      # FLIPPA TILL --apply när DENNA checklista är avbockad:
      #   1. En refresh har kört klart MED spärrhake-fixen (priserna är läkta).
      #   2. Loggen från det här steget är läst mot den korrekta datan.
      #   3. "SKONADES av platå-kravet" innehåller de äkta kurvorna, och raderingslistan
      #      innehåller bara platåer (samma värde dag efter dag).
      - if: steps.guard.outputs.ready == 'true'
        name: Korrupt prishistorik — TORRKÖRNING (raderar inget, se checklistan ovan)
        continue-on-error: true
        run: npx tsx scripts/purge-corrupt-snapshots.ts

      # ── KONSTAVTRYCK FÖR KORT SOM KOM IN I DAG ───────────────────────────────
      # jp-singles-refresh (steget "Priser + historik" ovan) SKAPAR kort när
      # leverantören fyller på ett japanskt set — 5 075 st 2026-09-01. Avtrycken
      # byggdes dittills BARA i söndagsjobbet (import-new-sets.yml), så ett kort
      # som kom in på en måndag var osynligt för skannerns bildmatchning i sex
      # dygn. Här ligger steget som ett STEG i ett fönster som redan är vaket —
      # noll nya Neon-väckningar, till skillnad från en manuell körning av
      # söndagsjobbet. Rör bara kort som saknar avtryck ⇒ sekunder de dagar
      # inget nytt kom. Söndagsjobbet behåller sitt steg (det kör EFTER
      # bildlagningen och fångar kort vars bild var död i dag).
      #
      # continue-on-error + egen timeout: ett hängt bildhämtande (fetch utan
      # timeout i skriptet) får varken rödmarkera en körning som redan skrivit
      # dagens priser eller äta upp jobbets 120 min. Söndagsjobbet är larmet.
      # `!cancelled()`: ett rött prissteg får inte svälta det här — samma fälla
      # som i import-new-sets.yml.
      - if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' }}
        name: Konstavtryck för nya kort (no-op om inga saknas)
        continue-on-error: true
        timeout-minutes: 60
        run: npx tsx scripts/build-art-fingerprints.ts
